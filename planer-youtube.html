<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="планер">
<meta name="theme-color" content="#080808">
<meta name="description" content="личный планер для работы над видео">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23080808'/%3E%3Cpath d='M90 27l14 39 42 1-33 26 12 40-35-24-35 24 12-40-33-26 42-1z' fill='white'/%3E%3C/svg%3E">
<title>планер ютуба</title>
<style>
:root{color-scheme:dark;--bg:#080808;--card:#171717;--card2:#222;--text:#f7f7f7;--muted:#858585;--line:#303030;--white:#fff;--ink:#080808;--accent:#fff;--bad:#db426d;--good:#b8f2d0;--shadow:0 0 22px #ffffff12;--radius:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;font-size:15px;font-weight:600;letter-spacing:-.025em;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));transition:background .3s,color .3s}
body.light{color-scheme:light;--bg:#f2f2f2;--card:#fff;--card2:#e9e9e9;--text:#111;--muted:#777;--line:#ddd;--white:#111;--ink:#fff;--accent:#111;--shadow:0 5px 24px #0000000b}
button,input,textarea,select{font:inherit;letter-spacing:inherit}button{border:0;cursor:pointer;color:inherit}button:active{transform:scale(.97)}.app{width:min(100%,620px);margin:auto;padding:15px 17px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:9px 0 21px}.brand{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:lowercase}.top-actions{display:flex;gap:9px}.circle{width:43px;height:43px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow);transition:all .25s}.circle.white{background:var(--white);color:var(--ink);box-shadow:0 0 20px #ffffff16}.theme-half{position:relative;overflow:hidden}.theme-half:before{content:"";position:absolute;left:0;top:0;width:50%;height:100%;background:var(--white);border-radius:100% 0 0 100%}.theme-half span{position:relative;color:var(--ink);font-size:13px}.honor{background:var(--card);border-radius:22px;padding:15px 17px;margin-bottom:20px}.honor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:lowercase}.honor-value{font-size:12px;color:var(--muted)}.honor-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#d44373,#555 45%,#f5f5f5);position:relative;margin:0 5px}.honor-knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:29px;height:29px;border-radius:50%;background:var(--bg);border:2px solid var(--text);display:grid;place-items:center;font-size:15px;box-shadow:0 0 16px #ffffff28;transition:left .5s cubic-bezier(.2,.8,.2,1);left:50%}.honor-knob.low{color:#e34a79}.honor-knob.high{color:var(--text)}.honor-track input{position:absolute;inset:-10px 0;width:100%;opacity:0;cursor:pointer}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}.section-head h2{font-size:22px;letter-spacing:-.055em;margin:0}.pill{background:var(--white);color:var(--ink);border-radius:999px;padding:10px 15px;font-size:12px;font-weight:800;box-shadow:0 0 18px #ffffff10}.pill.dark{background:var(--card2);color:var(--text);box-shadow:none}.pill:disabled{opacity:.35}.main-card{background:var(--white);color:var(--ink);border-radius:30px;padding:23px 22px 21px;min-height:250px;box-shadow:0 10px 38px #ffffff0b;animation:rise .35s ease}.main-card .eyebrow{color:color-mix(in srgb,var(--ink) 52%,transparent)}.task-title{font-size:27px;line-height:1.05;letter-spacing:-.06em;margin:12px 0 10px;font-weight:850}.task-desc{font-size:13px;line-height:1.45;opacity:.65;margin:0 0 18px;font-weight:550}.main-card .pill{background:var(--ink);color:var(--white);box-shadow:0 0 18px #00000014}.main-card .pill.secondary{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}.task-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}.tag{font-size:10px;border-radius:99px;padding:6px 9px;background:var(--card2);color:var(--text);display:inline-flex;align-items:center;gap:5px}.tag.done{background:#b8f2d0;color:#123b25}.tag.helper{background:#f0d7ff;color:#5b277a}.tag.weather{background:#d7eaff;color:#194d78}.main-card .tag{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 7px}.progress span{height:100%;display:block;background:var(--text);border-radius:99px;transition:width .4s}.main-card .progress{background:color-mix(in srgb,var(--ink) 14%,transparent)}.main-card .progress span{background:var(--ink)}.subtle{color:var(--muted);font-size:12px}.empty{text-align:center;padding:30px 16px;background:var(--card);border-radius:var(--radius)}.empty .big{font-size:33px;margin-bottom:8px}.list{display:grid;gap:9px}.task-row{background:var(--card);border-radius:21px;padding:15px 16px;display:flex;align-items:center;gap:12px;animation:rise .25s ease}.task-row .task-info{flex:1;min-width:0}.task-row h3{font-size:15px;margin:0 0 5px;line-height:1.2}.task-row p{font-size:11px;color:var(--muted);margin:0}.check{width:24px;height:24px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;flex-shrink:0}.check.checked{background:var(--white);color:var(--ink);border-color:var(--white)}.row-buttons{display:flex;gap:6px}.tiny{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:14px}.timer-card{background:var(--card);border-radius:27px;padding:22px;text-align:center;margin-top:12px}.timer-num{font-size:62px;font-weight:850;letter-spacing:-.08em;font-variant-numeric:tabular-nums;margin:6px 0 13px}.timer-controls{display:flex;justify-content:center;gap:9px}.timer-controls button{width:42px;height:42px;border-radius:50%;background:var(--card2);font-size:20px}.timer-controls .pill{width:auto;height:auto;font-size:12px;padding:12px 19px}.timer-footer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.block-steps{margin:13px 0 0 12px;padding-left:13px;border-left:1px solid var(--line);display:grid;gap:9px}.step{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted)}.step .check{width:18px;height:18px;font-size:10px}.step span:nth-child(2){flex:1}.modal-back{position:fixed;inset:0;background:#0009;backdrop-filter:blur(9px);z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));animation:fade .2s}.modal{background:var(--card);border:1px solid var(--line);border-radius:29px 29px 24px 24px;width:min(100%,590px);max-height:88dvh;overflow:auto;padding:23px 20px 20px;box-shadow:0 20px 70px #0007;animation:rise .25s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modal h2{font-size:23px;letter-spacing:-.055em;margin:0}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);outline:none;background:var(--bg);color:var(--text);border-radius:15px;padding:14px;font-size:14px}.field textarea{min-height:84px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.modal-actions button{flex:1;min-width:100px}.seg{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:99px}.seg button{flex:1;padding:10px 6px;border-radius:99px;background:transparent;color:var(--muted);font-size:11px}.seg button.active{background:var(--white);color:var(--ink)}.idea-input{display:flex;gap:8px}.idea-input input{flex:1;min-width:0}.idea-item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:13px}.idea-item:last-child{border:0}.copyright{text-align:center;color:#555;font-size:10px;letter-spacing:.12em;margin:35px 0 0}.nav{position:fixed;bottom:0;left:0;right:0;padding:10px 17px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 70%,transparent);z-index:5;display:flex;justify-content:center}.nav-inner{display:flex;gap:5px;background:var(--card);border:1px solid var(--line);padding:5px;border-radius:99px;box-shadow:0 5px 30px #0003}.nav button{background:transparent;color:var(--muted);border-radius:99px;padding:12px 17px;font-size:12px}.nav button.active{background:var(--white);color:var(--ink);box-shadow:0 0 15px #ffffff12}.toast{position:fixed;z-index:20;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--white);color:var(--ink);border-radius:99px;padding:12px 18px;font-size:12px;box-shadow:0 4px 25px #0004;white-space:nowrap;animation:rise .2s}.muted-note{font-size:12px;color:var(--muted);line-height:1.45}.divider{height:1px;background:var(--line);margin:16px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--card);border-radius:20px;padding:17px}.stat strong{font-size:25px;display:block;letter-spacing:-.06em}.stat span{font-size:11px;color:var(--muted)}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(min-width:560px){.modal-back{align-items:center}.app{padding-top:25px}.main-card{padding:27px}.task-title{font-size:32px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div><div class="brand">sixteendope / workspace</div><div style="font-size:23px;font-weight:850;letter-spacing:-.06em;margin-top:4px">планер ютуба</div></div>
    <div class="top-actions">
      <button class="circle" id="ideasBtn" aria-label="идеи">✎</button>
      <button class="circle" id="allBtn" aria-label="все задачи">☷</button>
      <button class="circle theme-half" id="themeBtn" aria-label="сменить тему"><span>◐</span></button>
    </div>
  </header>
  <section class="honor">
    <div class="honor-head"><span class="eyebrow">честь автора</span><span class="honor-value" id="honorLabel">50 / 100</span></div>
    <div class="honor-track"><div class="honor-knob" id="honorKnob">★</div><input id="honorSlider" type="range" min="0" max="100" value="50" aria-label="честь"></div>
  </section>
  <main id="view"></main>
  <div class="copyright">sixteendope ©</div>
</div>
<nav class="nav"><div class="nav-inner"><button class="active" data-view="today">сегодня</button><button data-view="all">все задачи</button><button data-view="video">новое видео</button></div></nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{
'use strict';
const KEY='sixteendope_youtube_planner_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'без даты';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>({honor:50,theme:'dark',tasks:[],ideas:[],video:null,session:null,logs:[],lastOpen:today(),lastDayDone:null,autoShift:0});
let state;try{state={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=defaults()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderHonor()}
function toast(s){$('#toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2300)}
function changeHonor(n){state.honor=Math.max(0,Math.min(100,Math.round(state.honor+n)));save()}
function renderHonor(){const v=state.honor;$('#honorLabel').textContent=`${v} / 100`;$('#honorKnob').style.left=v+'%';$('#honorKnob').className='honor-knob '+(v<35?'low':v>65?'high':'');$('#honorSlider').value=v;document.body.classList.toggle('light',state.theme==='light');document.querySelector('meta[name="theme-color"]').content=state.theme==='light'?'#f2f2f2':'#080808'}
$('#honorSlider').addEventListener('input',e=>{state.honor=+e.target.value;save()});
$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()};
$('#ideasBtn').onclick=()=>openIdeas();
$('#allBtn').onclick=()=>setView('all');
let currentView='today';
function setView(v){currentView=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function taskSteps(t){return t.steps||[]}
function complete(t){if(t.type==='block')return taskSteps(t).length>0&&taskSteps(t).every(s=>s.done);return !!t.done}
function activeTasks(){return state.tasks.filter(t=>!complete(t))}
function allDone(){return state.tasks.filter(complete).length}
function currentTask(){return state.tasks.find(t=>!complete(t))}
function taskLabel(t){return t.type==='timer'?'таймер':t.type==='shoot'?'снято':t.type==='day'?'на день':'блок'}
function taskDuration(t){return t.minutes||35}
function render(){
 renderHonor();
 const v=$('#view');
 if(currentView==='today')v.innerHTML=renderToday();
 else if(currentView==='all')v.innerHTML=renderAll();
 else if(currentView==='video')v.innerHTML=renderVideo();
 bindDynamic();
}
function renderToday(){
 const t=currentTask(), total=state.tasks.length, done=allDone(), video=state.video;
 let out=`<div class="section-head"><h2>сегодня</h2><span class="subtle">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</span></div>`;
 if(video)out+=`<div class="task-row" style="margin-bottom:12px"><div class="task-info"><h3>${esc(video.title)}</h3><p>выход ${fmtDate(video.release)} · осталось ${Math.max(0,Math.ceil((new Date(video.release+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000))} дн.</p><div class="progress"><span style="width:${videoProgress()}%"></span></div><p>сделано ${done} из ${total} шагов</p></div><button class="tiny" data-action="video-settings">⚙</button></div>`;
 if(!t)return out+`<div class="empty"><div class="big">✦</div><h2>на сегодня всё</h2><p class="subtle">можно выдохнуть. или наметить следующий ролик.</p><div class="actions" style="justify-content:center"><button class="pill" data-action="video-new">новое видео</button><button class="pill dark" data-action="task-new">добавить задачу</button><button class="pill dark" data-action="finish-day">завершить день</button></div></div>`;
 const isBlock=t.type==='block', nextStep=isBlock?taskSteps(t).find(s=>!s.done):null;
 const title=nextStep?nextStep.title:t.title;
 const desc=nextStep?`этап блока «${t.title}»`:t.note||'один шаг за раз. этого достаточно.';
 const type=nextStep?nextStep.type:t.type;
 out+=`<section class="main-card"><div class="eyebrow">${isBlock?'текущий блок':taskLabel(t)}${t.videoStage?' · видео':''}</div><div class="task-title">${esc(title)}</div><p class="task-desc">${esc(desc)}</p><div class="task-meta">${type==='timer'?`<span class="tag">◷ ${taskDuration(nextStep||t)} мин</span>`:type==='shoot'?'<span class="tag">● съёмка</span>':'<span class="tag">✓ без таймера</span>'}${t.helper?'<span class="tag helper">нужен помощник</span>':''}${t.weather?'<span class="tag weather">зависит от погоды</span>':''}</div>
 ${isBlock?`<div class="progress"><span style="width:${Math.round(taskSteps(t).filter(s=>s.done).length/Math.max(1,taskSteps(t).length)*100)}%"></span></div><div class="subtle">сделано ${taskSteps(t).filter(s=>s.done).length} из ${taskSteps(t).length} этапов</div>`:''}
 <div class="actions"><button class="pill" data-action="start" data-id="${t.id}" data-step="${nextStep?nextStep.id:''}">${type==='timer'?'начать · '+taskDuration(nextStep||t)+' мин':type==='shoot'?'снято':'начать'}</button><button class="pill secondary" data-action="not-today" data-id="${t.id}">не сегодня</button><button class="pill secondary" data-action="edit" data-id="${t.id}">•••</button></div></section>`;
 if(state.session)out+=renderTimer();
 out+=`<div class="section-head"><h2>ритм</h2><button class="pill dark" data-action="finish-day">завершить день</button></div><div class="stats"><div class="stat"><strong>${done}<span style="font-size:14px"> / ${total}</span></strong><span>шагов готово</span></div><div class="stat"><strong>${Math.round(state.logs.reduce((a,l)=>a+(l.minutes||0),0)/60*10)/10} ч</strong><span>учтено в сессиях</span></div></div>`;
 return out;
}
function renderTimer(){let s=state.session;if(!s)return'';let remain=Math.max(0,Math.ceil((s.endsAt-Date.now())/60000));let t=state.tasks.find(x=>x.id===s.taskId);return `<div class="timer-card"><div class="eyebrow">сейчас в работе</div><div style="font-size:16px;margin-top:8px">${esc(s.label||t?.title||'задача')}</div><div class="timer-num" id="timerNum">${String(Math.floor(remain/60)).padStart(2,'0')}:${String(remain%60).padStart(2,'0')}</div><div class="timer-controls"><button data-action="timer-minus">−</button><button data-action="timer-plus">+</button></div><div class="subtle" style="margin-top:9px">плюс-минус 5 минут</div><div class="timer-footer"><button class="pill dark" data-action="break">перерыв</button><button class="pill" data-action="timer-done">выполнено</button><button class="pill dark" data-action="not-today" data-id="${s.taskId}">не сегодня</button></div></div>`}
function renderAll(){
 let out=`<div class="section-head"><h2>все задачи</h2><button class="pill" data-action="task-new">+ задача</button></div>`;
 if(!state.tasks.length)return out+`<div class="empty"><div class="big">☷</div><h3>пока пусто</h3><p class="subtle">добавь один шаг или собери план видео.</p><button class="pill" data-action="video-new">собрать видео</button></div>`;
 out+=`<div class="list">`;
 state.tasks.forEach((t,i)=>{const done=complete(t),steps=taskSteps(t);out+=`<article class="task-row"><button class="check ${done?'checked':''}" data-action="toggle" data-id="${t.id}">${done?'✓':''}</button><div class="task-info"><h3 style="${done?'text-decoration:line-through;opacity:.55':''}">${esc(t.title)}</h3><p>${taskLabel(t)}${t.minutes?' · '+t.minutes+' мин':''}${t.videoStage?' · '+esc(t.videoStage):''}</p>${t.type==='block'?`<div class="block-steps">${steps.map(s=>`<div class="step"><button class="check ${s.done?'checked':''}" data-action="step-toggle" data-id="${t.id}" data-step="${s.id}">${s.done?'✓':''}</button><span style="${s.done?'text-decoration:line-through':''}">${esc(s.title)}</span><span>${s.type==='timer'?'◷':s.type==='shoot'?'●':'·'}</span></div>`).join('')}</div>`:''}</div><div class="row-buttons"><button class="tiny" data-action="edit" data-id="${t.id}">✎</button><button class="tiny" data-action="delete" data-id="${t.id}">×</button></div></article>`});
 out+='</div><div class="section-head"><h2>план и прогресс</h2></div>';
 out+=`<div class="task-row"><div class="task-info"><h3>${state.video?esc(state.video.title):'видео ещё не запланировано'}</h3><p>${state.video?'сделано '+allDone()+' из '+state.tasks.length+' шагов':'можно собрать этапы по шаблону'}</p></div><button class="pill" data-action="video-new">${state.video?'новое видео':'собрать'}</button></div>`;
 return out;
}
function renderVideo(){
 const v=state.video;
 return `<div class="section-head"><h2>план видео</h2><button class="pill" data-action="video-new">${v?'новый ролик':'+ собрать'}</button></div>${v?`<div class="main-card"><div class="eyebrow">текущий проект</div><div class="task-title">${esc(v.title)}</div><p class="task-desc">выход: ${fmtDate(v.release)}. очередь двигается вместе с тобой, пропущенные дни не окрашиваются красным.</p><div class="progress"><span style="width:${videoProgress()}%"></span></div><p class="task-desc">сделано ${allDone()} из ${state.tasks.length} шагов</p><div class="actions"><button class="pill" data-action="rebuild">пересобрать план</button><button class="pill secondary" data-action="finish-video">завершить ролик</button></div></div>`:`<div class="empty"><div class="big">✦</div><h3>соберём следующий ролик</h3><p class="subtle">введи название и дату выхода. этапы разложатся по рабочим дням.</p><button class="pill" data-action="video-new">создать план</button></div>`}<div class="section-head"><h2>как устроен план</h2></div><div class="task-row"><div class="task-info"><h3>1. подготовка</h3><p>идея, сценарий, биролы, сюжет глав и переходы</p></div></div><div class="task-row"><div class="task-info"><h3>2. съёмка</h3><p>говорящая голова, домашние и уличные биролы</p></div></div><div class="task-row"><div class="task-info"><h3>3. монтаж</h3><p>сброс, нарезка, сценки, переходы, звук, биролы, музыка, цвет</p></div></div><div class="task-row"><div class="task-info"><h3>4. финал</h3><p>рендер, превью и выкладка</p></div></div>`;
}
function videoProgress(){return Math.round(allDone()/Math.max(1,state.tasks.length)*100)}
function bindDynamic(){
 $('#view').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id,b.dataset.step));
}
function openModal(title,body,saveLabel='сохранить'){ $('#modalRoot').innerHTML=`<div class="modal-back" id="modalBack"><section class="modal"><div class="modal-head"><h2>${title}</h2><button class="circle" id="modalClose">×</button></div>${body}</section></div>`;$('#modalClose').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}; }
function closeModal(){$('#modalRoot').innerHTML=''}
function openTaskForm(id){
 const t=state.tasks.find(x=>x.id===id);
 openModal(t?'изменить задачу':'новая задача',`<form id="taskForm"><div class="field"><label>название</label><input name="title" required maxlength="100" value="${esc(t?.title||'')}" placeholder="например, придумать сценку"></div><div class="field"><label>тип задачи</label><div class="seg" id="typeSeg"><button type="button" data-type="timer" class="${!t||t.type==='timer'?'active':''}">таймер</button><button type="button" data-type="shoot" class="${t?.type==='shoot'?'active':''}">съёмка</button><button type="button" data-type="day" class="${t?.type==='day'?'active':''}">на день</button><button type="button" data-type="block" class="${t?.type==='block'?'active':''}">блок</button></div><input type="hidden" name="type" value="${t?.type||'timer'}"></div><div class="field" id="minutesField" style="${t?.type==='shoot'||t?.type==='day'||t?.type==='block'?'display:none':''}"><label>длительность, минут</label><input name="minutes" type="number" min="5" max="240" step="5" value="${t?.minutes||40}"></div><div class="field"><label>заметка, необязательно</label><textarea name="note" placeholder="что поможет начать">${esc(t?.note||'')}</textarea></div><div class="form-grid"><div class="field"><label><input type="checkbox" name="helper" ${t?.helper?'checked':''}> нужен помощник</label></div><div class="field"><label><input type="checkbox" name="weather" ${t?.weather?'checked':''}> зависит от погоды</label></div></div>${t?.type==='block'?`<p class="muted-note">этапы этого блока можно отмечать на экране «все задачи». для изменения этапов создай блок заново или используй шаблон видео.</p>`:''}<div class="modal-actions"><button class="pill" type="submit">${t?'сохранить':'добавить задачу'}</button>${t?`<button class="pill dark" type="button" id="deleteFromForm">удалить</button>`:''}</div></form>`);
 const form=$('#taskForm'), seg=$('#typeSeg');
 seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{seg.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));form.type.value=btn.dataset.type;$('#minutesField').style.display=['shoot','day','block'].includes(btn.dataset.type)?'none':''});
 if(t)$('#deleteFromForm').onclick=()=>{closeModal();action('delete',t.id)};
 form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const obj={id:t?.id||uid(),title:fd.get('title').trim(),type:fd.get('type'),minutes:Math.max(5,Math.min(240,+(fd.get('minutes')||40))),note:fd.get('note').trim(),helper:fd.has('helper'),weather:fd.has('weather'),done:false,createdAt:t?.createdAt||Date.now(),videoStage:t?.videoStage||'',steps:t?.steps||[]};if(obj.type==='block'&&!obj.steps.length)obj.steps=[{id:uid(),title:'первый этап',type:'timer',minutes:35,done:false}];if(t)state.tasks=state.tasks.map(x=>x.id===t.id?obj:x);else state.tasks.push(obj);save();closeModal();render();toast(t?'задача обновлена':'задача добавлена')};
}
function openVideoForm(rebuild=false){
 const v=state.video, date=rebuild&&v?v.release:addDays(today(),14);
 openModal(rebuild?'пересобрать план':'новое видео',`<form id="videoForm"><div class="field"><label>название ролика</label><input name="title" required maxlength="120" value="${esc(v?.title||'')}" placeholder="о чём будет это видео?"></div><div class="field"><label>дата выхода</label><input name="release" type="date" required min="${today()}" value="${date}"></div><p class="muted-note">оставшиеся этапы разложатся по будням в обратном порядке от даты выхода. очередь остаётся гибкой: если день пропущен, задачи просто ждут.</p><div class="modal-actions"><button class="pill" type="submit">${rebuild?'пересобрать':'создать план'}</button></div></form>`);
 $('#videoForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),title=fd.get('title').trim(),release=fd.get('release');if(rebuild&&state.video){state.video.title=title;state.video.release=release;rebuildRemaining()}else{state.tasks=state.tasks.filter(t=>!t.videoStage);state.video={title,release,createdAt:Date.now()};buildVideoTasks(title,release)}save();closeModal();setView('today');toast(rebuild?'план пересобран':'план видео готов')};
}
const template=[
 ['подготовка','идея и название','timer',35],['подготовка','сценарий','timer',45],['подготовка','список бирол','timer',35],['подготовка','сюжет и сценки для каждой главы','timer',40],['подготовка','переходы между главами','timer',35],
 ['съёмка','говорящая голова','shoot',0],['съёмка','домашние биролы','shoot',0],['съёмка','уличные биролы','shoot',0],
 ['монтаж','сброс на комп','day',0],['монтаж','нарезка говорящей головы','timer',55],['монтаж','начальная сценка и крутые моменты','timer',50],['монтаж','переходы','timer',40],['монтаж','саунддизайн','timer',45],['монтаж','вставка бирол','timer',50],['монтаж','музыка','timer',35],['монтаж','цветокоррекция','timer',45],
 ['финал','рендер','day',0],['финал','превью','day',0],['финал','выкладка','day',0]
];
function weekdayBackwards(date,n){let arr=[],d=date;while(arr.length<n){let x=new Date(d+'T12:00:00');if(x.getDay()!==0&&x.getDay()!==6)arr.push(d);d=addDays(d,-1)}return arr.reverse()}
function buildVideoTasks(title,release){
 const dates=weekdayBackwards(release,template.length);
 state.tasks=state.tasks.filter(t=>!t.videoStage);
 template.forEach((x,i)=>{let [stage,name,type,minutes]=x;state.tasks.push({id:uid(),title:name,type,minutes:minutes||undefined,note:'',done:false,createdAt:Date.now(),videoStage:stage,plannedDate:dates[i],helper:stage==='съёмка'&&name==='уличные биролы',weather:name==='уличные биролы',steps:[]})});
 state.tasks.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));state.video={title,release,createdAt:Date.now()};
}
function rebuildRemaining(){const remain=state.tasks.filter(t=>!complete(t)&&t.videoStage);const dates=weekdayBackwards(state.video.release,remain.length);remain.forEach((t,i)=>t.plannedDate=dates[i]);}
function openIdeas(){openModal('быстрая идея',`<form id="ideaForm"><div class="field"><label>запиши, пока не забыл</label><input name="idea" maxlength="240" placeholder="идея для видео..." required></div><div class="modal-actions"><button class="pill" type="submit">сохранить идею</button></div></form><div class="divider"></div><div class="section-head" style="margin-top:0"><h2 style="font-size:17px">мои идеи</h2><span class="subtle">${state.ideas.length}</span></div><div id="ideasList">${state.ideas.length?state.ideas.slice().reverse().map(i=>`<div class="idea-item"><span>${esc(i.text)}</span><button class="tiny" data-idea="${i.id}">×</button></div>`).join(''):'<p class="muted-note">пока пусто. любая мысль может стать роликом.</p>'}</div>`);
 $('#ideaForm').onsubmit=e=>{e.preventDefault();const textv=new FormData(e.target).get('idea').trim();if(textv){state.ideas.push({id:uid(),text:textv,at:Date.now()});save();closeModal();openIdeas();toast('идея сохранена')}};
 $('#ideasList').querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{state.ideas=state.ideas.filter(i=>i.id!==b.dataset.idea);save();openIdeas()});
}
function logWork(minutes,kind='work'){state.logs.push({date:today(),minutes,kind,at:Date.now()})}
function markDone(t,stepId){
 if(t.type==='block'){const s=t.steps.find(x=>x.id===stepId)||t.steps.find(x=>!x.done);if(s)s.done=true;if(complete(t)){changeHonor(4);toast('блок завершён ✦')}else changeHonor(2)}
 else{t.done=true;changeHonor(4)}
 state.session=null;save();render();
}
function action(a,id,stepId){
 const t=state.tasks.find(x=>x.id===id);
 if(a==='task-new')return openTaskForm();
 if(a==='video-new')return openVideoForm(false);
 if(a==='video-settings')return openVideoForm(true);
 if(a==='rebuild')return openVideoForm(true);
 if(a==='edit'&&t)return openTaskForm(id);
 if(a==='delete'&&t){if(confirm('удалить задачу?')){state.tasks=state.tasks.filter(x=>x.id!==id);save();render();toast('задача удалена')}return}
 if(a==='toggle'&&t){if(t.type==='block'){const s=t.steps.find(x=>!x.done);if(s)s.done=true}else t.done=!t.done;if(complete(t))changeHonor(4);save();render();return}
 if(a==='step-toggle'&&t){const s=t.steps.find(x=>x.id===stepId);if(s){s.done=!s.done;if(s.done)changeHonor(2)}save();render();return}
 if(a==='start'&&t){
  const item=t.type==='block'?t.steps.find(s=>!s.done):t;
  if(!item)return;
  if(item.type==='timer'){const mins=item.minutes||t.minutes||40;state.session={taskId:t.id,stepId:item===t?'':item.id,startedAt:Date.now(),endsAt:Date.now()+mins*60000,minutes:mins,label:item===t?t.title:item.title};save();try{if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(w=>window.__wakeLock=w).catch(()=>{})}catch(e){}render();toast('время пошло, можно сосредоточиться')}
  else{if(t.type==='block'){item.done=true;if(complete(t))changeHonor(4);else changeHonor(2)}else t.done=true;logWork(0,'shoot');save();render();toast(item.type==='shoot'?'съёмка отмечена':'готово, один шаг закрыт ✦')}
  return;
 }
 if(a==='not-today'&&t){state.session=null;state.autoShift=(state.autoShift||0)+1;changeHonor(-3);save();render();toast('без вины. задача останется в очереди');return}
 if(a==='timer-plus'||a==='timer-minus'){if(state.session){const delta=a==='timer-plus'?5:-5;state.session.endsAt+=delta*60000;state.session.minutes=Math.max(5,(state.session.minutes||40)+delta);save();render()}return}
 if(a==='break'){if(state.session){const mins=Math.max(1,Math.round((state.session.endsAt-state.session.startedAt)/60000));logWork(Math.max(0,mins),'work');state.session=null;save();render();toast('перерыв. можно немного отойти')}return}
 if(a==='timer-done'){if(state.session){const s=state.session,t=state.tasks.find(x=>x.id===s.taskId);const mins=Math.max(1,Math.round((Date.now()-s.startedAt)/60000));logWork(mins);if(t)markDone(t,s.stepId);else{state.session=null;save();render()}}return}
 if(a==='finish-day')return finishDay();
 if(a==='finish-video'){if(confirm('завершить ролик и убрать его этапы из текущего плана?')){state.tasks=state.tasks.filter(t=>!t.videoStage);state.video=null;changeHonor(5);save();render();toast('ролик закрыт. хорошая работа')}return}
}
function finishDay(){
 const doneToday=state.tasks.filter(t=>t.doneAt===today()).length;
 const minutes=state.logs.filter(l=>l.date===today()).reduce((s,l)=>s+(l.minutes||0),0);
 const remain=activeTasks().length,release=state.video?.release,days=release?Math.ceil((new Date(release+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null;
 const old=state.honor;let delta=0;
 if(state.lastDayDone!==today()){delta=remain===0?2:doneToday>0?2:-2;changeHonor(delta);state.lastDayDone=today();state.logs.push({date:today(),minutes:0,kind:'day'});save()}
 openModal('итоги дня',`<div class="stats"><div class="stat"><strong>${doneToday}</strong><span>шагов закрыто сегодня</span></div><div class="stat"><strong>${Math.floor(minutes/60)}ч ${minutes%60}м</strong><span>время в работе</span></div><div class="stat"><strong>${remain}</strong><span>шагов осталось</span></div><div class="stat"><strong>${days===null?'—':Math.max(0,days)}</strong><span>дней до выхода</span></div></div><div class="divider"></div><div class="task-row"><div class="task-info"><h3>честь автора</h3><p>${old} → ${state.honor} ${delta>0?'· +'+delta:delta<0?'· '+delta:'· без изменений'}</p></div><div style="font-size:24px">${state.honor>=50?'★':'☆'}</div></div><p class="muted-note" style="margin-top:15px">день не обязан быть идеальным. важно увидеть, что получилось, и вернуться завтра.</p><div class="modal-actions"><button class="pill" id="closeSummary">закрыть день</button></div>`);
 $('#closeSummary').onclick=()=>{closeModal();render();toast('день завершён. отдых тоже часть работы')};
}
function bindTimerTick(){setInterval(()=>{if(state.session){const remain=state.session.endsAt-Date.now();const n=$('#timerNum');if(n){const m=Math.max(0,Math.ceil(remain/60000));n.textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}if(remain<=0&&!state.session.alerted){state.session.alerted=true;save();toast('время вышло. перерыв или закрываем шаг?');if(n){n.style.color='var(--bad)';}}}},1000)}
// Keep completed timestamps and allow the task queue to remain flexible.
const originalMarkDone=markDone;
markDone=function(t,stepId){const was=complete(t);originalMarkDone(t,stepId);if(!was&&complete(t)){t.doneAt=today();save()}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.session&&state.session.endsAt<=Date.now()&&!state.session.alerted){state.session.alerted=true;save();toast('время вышло. перерыв или закрываем шаг?')}});
render();bindTimerTick();
})();
</script>
</body>
