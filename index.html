<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>планер ютуба</title>
<style>
:root{--bg:#000;--c:#1c1c1e;--c2:#2c2c2e;--tx:#fff;--mu:#8e8e93;--inv:#fff;--it:#000;--gl:rgba(255,255,255,.2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f2f2f7;--c:#fff;--c2:#e5e5ea;--tx:#000;--inv:#000;--it:#fff;--gl:rgba(0,0,0,.14);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:-apple-system,"SF Pro Display",Inter,Helvetica,Arial,sans-serif;font-weight:600;min-height:100vh;text-transform:lowercase}
#app{max-width:520px;margin:0 auto;padding:18px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}
h1{font-size:40px;font-weight:800;margin:0;letter-spacing:-1px}
.bt{display:flex;gap:10px}
.rb{width:56px;height:56px;border-radius:50%;background:var(--c);border:0;color:var(--tx);font-size:24px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center}
.ht{width:26px;height:26px;border-radius:50%;border:3px solid var(--tx);background:linear-gradient(90deg,var(--tx) 50%,transparent 50%)}
.hon{position:relative;height:48px;margin:6px 0 18px}
.trk{position:absolute;left:0;right:0;top:22px;height:4px;border-radius:4px;background:var(--c2)}
.kn{position:absolute;top:0;width:48px;height:48px;border-radius:50%;background:#1c1c1e;border:2px solid var(--c2);box-shadow:0 0 22px var(--gl);display:flex;align-items:center;justify-content:center;font-size:24px;transition:left .7s cubic-bezier(.3,.8,.3,1),color .7s}
.hl{color:var(--mu);font-size:13px;letter-spacing:2px;margin:0 0 4px 4px}
.main{background:var(--inv);color:var(--it);border-radius:32px;padding:26px;box-shadow:0 0 60px var(--gl);animation:up .5s}
.lb{font-size:13px;letter-spacing:2px;opacity:.5}
.big{font-size:30px;font-weight:800;line-height:1.1;margin:10px 0 8px}
.sb{opacity:.55;font-size:15px;margin-bottom:22px}
.go{width:100%;height:56px;border-radius:28px;border:0;background:var(--it);color:var(--inv);font-size:17px;font-weight:800;font-family:inherit;transition:transform .15s}
.go:active,.rb:active,.pill:active{transform:scale(.96)}
.tl{display:flex;gap:12px;margin:14px 0}
.tile{flex:1;background:var(--c);border-radius:26px;padding:18px}
.tile b{display:block;font-size:26px;font-weight:800;margin-top:6px}
.tile span{color:var(--mu);font-size:13px;letter-spacing:1px}
.lk{display:flex;justify-content:space-between;padding:22px 14px 8px;font-size:22px;font-weight:800;text-shadow:0 0 18px var(--gl)}
.lk a{cursor:pointer}
.cp{text-align:center;color:var(--mu);margin-top:34px;font-size:15px}
.vh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.vh b{font-size:24px;font-weight:800}.vh small,.mu{color:var(--mu);font-size:13px}
.g{background:var(--c);border-radius:26px;padding:6px 16px;margin-bottom:10px;overflow:hidden;max-height:900px;transition:max-height .7s cubic-bezier(.3,.8,.3,1),padding .7s,opacity .7s}
.g.d{max-height:56px;opacity:.55}
.gn{font-size:17px;font-weight:800;padding:14px 0;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--c2)}
.row span{flex:1}.row.x span{color:var(--mu);text-decoration:line-through}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mu);flex:none}
.x .ck{background:var(--tx);border-color:var(--tx)}
.row b{color:var(--mu);padding:0 6px;font-size:20px}
.pill{background:var(--c);border:0;color:var(--tx);border-radius:24px;padding:14px 20px;font-size:16px;font-weight:800;font-family:inherit;margin:4px 6px 4px 0}
.pill.w{background:var(--inv);color:var(--it)}
.tm{text-align:center;font-size:84px;font-weight:800;margin:70px 0 10px;letter-spacing:-3px;text-shadow:0 0 40px var(--gl)}
.tc{text-align:center}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:9;animation:fd .25s}
.si{background:var(--c);width:100%;max-width:520px;margin:0 auto;border-radius:32px 32px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .35s}
.si h2{margin:0 0 14px;font-size:26px;font-weight:800}
input,select{width:100%;background:var(--c2);color:var(--tx);border:0;border-radius:18px;padding:15px;font-size:16px;font-family:inherit;margin:0 0 10px;text-transform:none}
.ln{padding:8px 0;color:var(--tx);font-size:17px}
@keyframes up{from{transform:translateY(14px);opacity:0}}@keyframes fd{from{opacity:0}}
</style></head><body><div id="app"></div>
<script>
var K="planer_yt_v1",S,A=document.getElementById("app");
function day(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function id(){return Math.random().toString(36).slice(2,8)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={theme:"dark",honor:50,videos:[],ideas:[],log:{},view:"today",timer:null,last:day(),pen:""};
function lg(){var k=day();return S.log[k]=S.log[k]||{d:0,m:0,h:S.honor}}
function wd(a,b){var n=0,x=new Date(a);x.setDate(x.getDate()+1);while(x<=new Date(b)){if(x.getDay()%6)n++;x.setDate(x.getDate()+1)}return n}
function init(){lg();if(cur()&&S.pen!=day()){var m=wd(S.last,day())-(new Date().getDay()%6?1:0);if(m>0)S.honor=Math.max(0,S.honor-Math.min(10,m*2));S.pen=day()}save()}
var T=[["подготовка",[["идея и название","t",30],["сценарий","t",40],["список бирол","t",30],["сюжет и сценки: как показать мысль каждой главы","t",40],["переходы между главами","t",40]]],
["съемка",[["говорящая голова","s"],["домашние биролы","s"],["уличные биролы (нужен помощник)","s"]]],
["монтаж",[["сброс на комп","s"],["нарезка головы","t",60],["начальная сценка и крутые моменты","t",60],["переходы","t",45],["саунддизайн","t",45],["вставка бирол","t",60],["музыка","t",40],["цветокоррекция","t",45]]],
["финал",[["рендер","d"],["превью","d"],["выкладка","d"]]]];
function mk(n,dt){return{id:id(),n:n,date:dt,groups:T.map(function(g){return{id:id(),n:g[0],tasks:g[1].map(function(t){return{id:id(),n:t[0],y:t[1],m:t[2]||0,done:0}})}})}}
function cur(){for(var v of S.videos)for(var g of v.groups)for(var t of g.tasks)if(!t.done)return{v:v,g:g,t:t};return null}
function st(){var a=0,d=0;S.videos.forEach(function(v){v.groups.forEach(function(g){g.tasks.forEach(function(t){a++;if(t.done)d++})})});return{a:a,d:d}}
function fin(t,g){lg();t.done=1;S.honor=Math.min(100,S.honor+4);var L=lg();L.d++;L.m+=t.m||0;S.last=day();if(g.tasks.every(function(x){return x.done}))S.anim=g.id}
function skip(c){lg();S.honor=Math.max(0,S.honor-3);var a=c.g.tasks,i=a.indexOf(c.t);if(i<a.length-1){a.splice(i,1);a.splice(i+1,0,c.t)}}
function hdr(t){return'<div class="top"><h1>'+t+'</h1><div class="bt"><button class="rb" data-a="idea">+</button><button class="rb" data-a="theme"><span class="ht"></span></button></div></div>'}
function hon(){var h=S.honor,r=Math.round(190+65*h/100),g=Math.round(20+235*h/100),b=Math.round(80+175*h/100);
return'<div class="hl">честь</div><div class="hon"><div class="trk"></div><div class="kn" style="left:calc((100% - 48px)*'+h/100+');color:rgb('+r+','+g+','+b+');text-shadow:0 0 14px rgb('+r+','+g+','+b+')">★</div></div>'}
function today(){var c=cur(),s=st(),h=hdr("сегодня")+hon();
if(!c)h+='<div class="main"><div class="lb">сейчас</div><div class="big">задач нет</div><div class="sb">создай видео, и я раскидаю этапы</div><button class="go" data-a="newv">новое видео</button></div>';
else{var y=c.t.y;h+='<div class="main"><div class="lb">сейчас</div><div class="big">'+esc(c.t.n)+'</div><div class="sb">'+esc(c.v.n)+' · '+c.g.n+(y=="t"?' · '+c.t.m+' мин':'')+'</div><button class="go" data-a="go">'+(y=="t"?"начать":y=="s"?"снято":"готово")+'</button></div>';
var dl=c.v.date?Math.ceil((new Date(c.v.date)-new Date(day()))/864e5):null;
h+='<div class="tl"><div class="tile"><span>шагов</span><b>'+s.d+' из '+s.a+'</b></div><div class="tile"><span>до выхода</span><b>'+(dl===null?"-":dl+" дн")+'</b></div></div>'}
return h+'<div class="lk"><a data-a="all">все задачи</a><a data-a="end">завершить день</a></div>'}
function all(){var h=hdr("все задачи")+'<button class="pill w" data-a="back">назад</button><button class="pill" data-a="newv">новое видео</button><button class="pill" data-a="addt">+ задача</button>';
S.videos.forEach(function(v){var left=0;v.groups.forEach(function(g){g.tasks.forEach(function(t){if(!t.done)left++})});
var pd=v.date&&left?Math.ceil(left/Math.max(1,wd(day(),v.date))*10)/10:0;
h+='<div class="vh"><b>'+esc(v.n)+'</b><small data-a="rp" data-id="'+v.id+'">'+(v.date?v.date.slice(5)+" · ":"")+left+' шагов'+(pd?' · ~'+pd+'/день':'')+' ✎</small></div>';
v.groups.forEach(function(g){var d=g.tasks.every(function(t){return t.done});var an=S.anim==g.id;
h+='<div class="g'+(d&&!an?' d':'')+'" data-g="'+g.id+'"><div class="gn"><span>'+g.n+'</span><span class="mu">'+(d?'готово':g.tasks.filter(function(t){return t.done}).length+'/'+g.tasks.length)+'</span></div>';
g.tasks.forEach(function(t){h+='<div class="row'+(t.done?' x':'')+'" data-a="tg" data-id="'+t.id+'"><i class="ck"></i><span>'+esc(t.n)+'</span>'+(t.y=="t"?'<small class="mu">'+t.m+'м</small>':'')+'<b data-a="del" data-id="'+t.id+'">×</b></div>'});h+='</div>'})});
if(!S.videos.length)h+='<p class="mu" style="padding:20px 4px">пока пусто</p>';return h}
function mmss(ms){ms=Math.max(0,Math.ceil(ms/1000));return("0"+Math.floor(ms/60)).slice(-2)+":"+("0"+ms%60).slice(-2)}
function tim(){var T=S.timer,c=cur(),w=T.k=="w",h=hdr(w?"таймер":"перерыв")+'<div class="tc mu">'+(w&&c?esc(c.t.n):"выдохни")+'</div>';
if(T.fin)return h+'<div class="tm" style="font-size:40px">'+(w?"время вышло":"перерыв закончился")+'</div><div class="tc">'+(w?'<button class="pill" data-a="tb">перерыв</button><button class="pill w" data-a="td">выполнено</button><button class="pill" data-a="tn">не сегодня</button>':'<button class="pill w" data-a="tx">продолжить</button>')+'</div>';
return h+'<div class="tm" id="tm">'+mmss(T.end-Date.now())+'</div><div class="tc"><button class="pill" data-a="tm5">- 5</button><button class="pill" data-a="tp5">+ 5</button><button class="pill" data-a="tx">стоп</button></div>'}
function R(){document.documentElement.dataset.theme=S.theme;A.innerHTML=(S.timer?tim():S.view=="all"?all():today())+'<div class="cp">sixteendope ©</div>';
if(S.anim){var g=A.querySelector('[data-g="'+S.anim+'"]');S.anim=null;if(g)setTimeout(function(){g.classList.add("d")},60)}}
function sheet(h){var d=document.createElement("div");d.className="sh";d.dataset.a="cl";d.innerHTML='<div class="si">'+h+'</div>';document.body.appendChild(d);return d}
function cl(){var s=document.querySelector(".sh");if(s)s.remove()}
function fnd(i){for(var v of S.videos)for(var g of v.groups)for(var t of g.tasks)if(t.id==i)return{v:v,g:g,t:t}}
var D={
theme:function(){S.theme=S.theme=="dark"?"light":"dark"},
all:function(){S.view="all"},back:function(){S.view="today"},
go:function(){var c=cur();if(!c)return;if(c.t.y=="t"){S.timer={k:"w",end:Date.now()+c.t.m*6e4,m:c.t.m};try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}else fin(c.t,c.g)},
tp5:function(){S.timer.end+=3e5;S.timer.m+=5},tm5:function(){S.timer.end-=3e5;S.timer.m=Math.max(5,S.timer.m-5)},
tx:function(){S.timer=null},
td:function(){var c=cur();if(c){c.t.m=S.timer.m||c.t.m;fin(c.t,c.g)}S.timer=null},
tn:function(){var c=cur();if(c)skip(c);S.timer=null},
tb:function(){S.timer={k:"b",end:Date.now()+6e5}},
tg:function(e){var f=fnd(e.dataset.id);if(!f)return;if(f.t.done)f.t.done=0;else fin(f.t,f.g)},
del:function(e){var f=fnd(e.dataset.id);if(f&&confirm("удалить?"))f.g.tasks.splice(f.g.tasks.indexOf(f.t),1)},
idea:function(){var h='<h2>идея</h2><input id="iv" placeholder="что пришло в голову"><button class="pill w" data-a="ia">записать</button>';S.ideas.forEach(function(x,i){h+='<div class="ln">'+esc(x)+' <span class="mu" data-a="id" data-id="'+i+'">×</span></div>'});sheet(h);return 1},
ia:function(){var v=document.getElementById("iv").value.trim();if(v)S.ideas.unshift(v);cl();D.idea();return 1},
id:function(e){S.ideas.splice(+e.dataset.id,1);cl();D.idea();return 1},
newv:function(){var x=new Date();x.setDate(x.getDate()+14);sheet('<h2>новое видео</h2><input id="nn" placeholder="название"><input id="nd" type="date" value="'+day(x)+'"><button class="pill w" data-a="nc">создать</button>');return 1},
nc:function(){var n=document.getElementById("nn").value.trim();if(!n)return 1;S.videos.push(mk(n,document.getElementById("nd").value));cl();S.view="today"},
rp:function(e){sheet('<h2>пересобрать план</h2><p class="mu">новая дата выхода, остальные шаги разделятся по дням</p><input id="nd" type="date" value="'+day()+'"><button class="pill w" data-a="rc" data-id="'+e.dataset.id+'">готово</button>');return 1},
rc:function(e){S.videos.forEach(function(v){if(v.id==e.dataset.id)v.date=document.getElementById("nd").value});cl()},
addt:function(){sheet('<h2>новая задача</h2><input id="an" placeholder="что сделать"><select id="ay"><option value="t">с таймером</option><option value="s">одним тапом</option><option value="d">на день</option></select><input id="am" type="number" value="30" placeholder="минут"><button class="pill w" data-a="ac">добавить</button>');return 1},
ac:function(){var n=document.getElementById("an").value.trim();if(!n)return 1;var v=S.videos.filter(function(x){return x.id=="own"})[0];if(!v){v={id:"own",n:"свои задачи",date:"",groups:[{id:id(),n:"задачи",tasks:[]}]};S.videos.unshift(v)}
v.groups[0].tasks.push({id:id(),n:n,y:document.getElementById("ay").value,m:+document.getElementById("am").value||30,done:0});cl()},
end:function(){var L=lg(),s=st(),c=cur(),dl=c&&c.v.date?Math.ceil((new Date(c.v.date)-new Date(day()))/864e5):null,dh=S.honor-L.h;
sheet('<h2>итоги дня</h2><div class="ln">сделано шагов: '+L.d+'</div><div class="ln">в работе: '+L.m+' мин</div><div class="ln">честь: '+(dh>0?"+":"")+dh+'</div><div class="ln">всего: '+s.d+' из '+s.a+' шагов</div>'+(dl!==null?'<div class="ln">до выхода: '+dl+' дн</div>':'')+'<button class="pill w" data-a="cl">закрыть</button>');return 1},
cl:function(){cl();return 1}};
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(!t)return;var a=t.dataset.a;if(a=="cl"&&e.target.closest(".si")&&!e.target.dataset.a)return;
if(D[a]){var r=D[a](t);save();if(!r||a=="idea")R();if(r&&(a=="ia"||a=="id"||a=="nc"))R()}});
setInterval(function(){var T=S.timer;if(!T||T.fin)return;if(T.end-Date.now()<=0){T.fin=1;save();R()}else{var el=document.getElementById("tm");if(el)el.textContent=mmss(T.end-Date.now())}},500);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.timer){if(!S.timer.fin&&S.timer.end<=Date.now())S.timer.fin=1;R()}});
init();R();
</script></body></html>
