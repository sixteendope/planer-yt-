<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>планер ютуба</title>
<style>
:root{--bg:#000;--c:#1c1c1e;--c2:#2c2c2e;--tx:#fff;--mu:#8e8e93;--inv:#fff;--it:#000;--gl:rgba(255,255,255,.22);color-scheme:dark}
:root[data-theme=light]{--bg:#f2f2f7;--c:#fff;--c2:#e5e5ea;--tx:#000;--inv:#000;--it:#fff;--gl:rgba(0,0,0,.16);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);touch-action:manipulation;min-height:100%}
html.ns,html.ns body{overflow:hidden;position:fixed;inset:0;width:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Display",Inter,Helvetica,Arial,sans-serif;font-weight:400;min-height:100dvh;text-transform:lowercase;transition:background .4s,color .4s}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);zoom:.9;transition:opacity .22s,transform .22s,filter .22s}
#app.o{opacity:0;transform:translateY(-6px);filter:blur(6px)}
#app.i{animation:in .55s cubic-bezier(.3,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(12px);filter:blur(8px)}}
@keyframes gl{0%{box-shadow:0 0 0 transparent}30%{box-shadow:0 0 44px var(--gl)}100%{box-shadow:0 0 0 transparent}}
@keyframes gt{0%{text-shadow:0 0 0 transparent}30%{text-shadow:0 0 22px var(--gl)}100%{text-shadow:0 0 0 transparent}}
.main,.kn,.tile,.g,.rb{animation:gl 2s ease-out}
.lk a,h1,.tm{animation:gt 2s ease-out}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}
h1{font-size:38px;font-weight:600;margin:0;letter-spacing:-1px;line-height:1.1}
.bt{display:flex;gap:10px}
.rb{width:54px;height:54px;border-radius:50%;background:var(--c);border:0;color:var(--tx);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .2s}
.rb svg{display:block}
.ht{display:block;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--tx);background:linear-gradient(90deg,var(--tx) 50%,transparent 50%)}
.hon{position:relative;height:48px;margin:6px 0 18px}
.trk{position:absolute;left:0;right:0;top:22px;height:4px;border-radius:4px;background:var(--c2)}
.kn{position:absolute;top:0;width:48px;height:48px;border-radius:50%;background:#1c1c1e;border:2px solid var(--c2);display:flex;align-items:center;justify-content:center;transition:left .9s cubic-bezier(.3,.8,.3,1),color .9s}
.kn svg{display:block;filter:drop-shadow(0 0 6px currentColor)}
.hl{color:var(--mu);font-size:13px;letter-spacing:2px;margin:0 0 4px 4px}
.main{background:var(--inv);color:var(--it);border-radius:30px;padding:24px}
.lb{font-size:13px;letter-spacing:2px;opacity:.5}
.big{font-size:28px;font-weight:600;line-height:1.15;margin:10px 0 8px}
.sb{opacity:.55;font-size:15px;margin-bottom:20px}
.btn,.go,.pill{display:inline-flex;align-items:center;justify-content:center;line-height:1;border:0;font-family:inherit;font-weight:500;transition:transform .2s,opacity .3s}
.go{width:100%;height:54px;border-radius:27px;background:var(--it);color:var(--inv);font-size:17px}
.go:active,.rb:active,.pill:active{transform:scale(.95)}
.fm{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s cubic-bezier(.3,.8,.3,1),opacity .45s,margin .55s}
.fm>div{overflow:hidden;min-height:0}
.main.open .fm{grid-template-rows:1fr;opacity:1;margin-bottom:14px}
.main input{background:rgba(128,128,128,.16);color:var(--it)}
.cn{display:block;text-align:center;opacity:.5;padding:4px 0 2px;font-size:15px}
.tl{display:flex;gap:12px;margin:14px 0}
.tile{flex:1;background:var(--c);border-radius:24px;padding:16px}
.tile b{display:block;font-size:24px;font-weight:600;margin-top:6px}
.tile span{color:var(--mu);font-size:13px;letter-spacing:1px}
.lk{display:flex;justify-content:center;gap:34px;padding:24px 0 8px;font-size:19px;font-weight:500}
.lk a{cursor:pointer;line-height:1.2}
.cp{text-align:center;color:var(--mu);margin-top:34px;font-size:14px}
.vh{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px;gap:10px}
.vh b{font-size:22px;font-weight:600}.vh small,.mu{color:var(--mu);font-size:13px}
.g{background:var(--c);border-radius:24px;padding:4px 16px;margin-bottom:10px;overflow:hidden;max-height:900px;transition:max-height .8s cubic-bezier(.3,.8,.3,1),opacity .8s}
.g.d{max-height:54px;opacity:.5}
.gn{font-size:17px;font-weight:600;height:46px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--c2);line-height:1.25}
.row span{flex:1}.row.x span{color:var(--mu);text-decoration:line-through}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mu);flex:none;transition:background .3s,border-color .3s}
.x .ck{background:var(--tx);border-color:var(--tx)}
.row b{color:var(--mu);padding:0 6px;font-size:20px;font-weight:400;line-height:1}
.pill{background:var(--c);color:var(--tx);border-radius:24px;height:46px;padding:0 20px;font-size:16px;margin:4px 6px 4px 0}
.pill.w{background:var(--inv);color:var(--it)}
.tm{text-align:center;font-size:84px;font-weight:500;margin:60px 0 10px;letter-spacing:-3px;line-height:1.1}
.tm.sm{font-size:36px;letter-spacing:-1px}
.tc{text-align:center}
.po{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:background .35s,backdrop-filter .35s,-webkit-backdrop-filter .35s}
.po.on{background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pi{width:100%;max-width:420px;background:var(--c);border-radius:30px;padding:22px;opacity:0;transform:scale(.94);filter:blur(10px);transition:opacity .35s,transform .4s cubic-bezier(.3,.8,.3,1),filter .35s;zoom:.9;text-transform:lowercase;color:var(--tx)}
.po.on .pi{opacity:1;transform:none;filter:none}
.pi h2{margin:0 0 14px;font-size:26px;font-weight:600}
input,select{display:block;width:100%;min-height:52px;background:var(--c2);color:var(--tx);border:0;border-radius:18px;padding:0 15px;font-size:16px;font-family:inherit;margin:0 0 10px;text-transform:none;text-align:left;-webkit-appearance:none;appearance:none;outline:none}
input::-webkit-date-and-time-value{text-align:left}
.ln{padding:8px 0;font-size:17px;display:flex;justify-content:space-between}
</style></head><body><div id="app"></div>
<script>
var K="planer_yt_v1",S,A=document.getElementById("app"),busy=0;
function day(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function id(){return Math.random().toString(36).slice(2,8)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={theme:"dark",honor:50,videos:[],ideas:[],log:{},view:"today",timer:null,last:day(),pen:""};
S.view="today";
function lg(){var k=day();return S.log[k]=S.log[k]||{d:0,m:0,h:S.honor}}
function wd(a,b){var n=0,x=new Date(a);x.setDate(x.getDate()+1);while(x<=new Date(b)){if(x.getDay()%6)n++;x.setDate(x.getDate()+1)}return n}
function init(){lg();if(cur()&&S.pen!=day()){var m=wd(S.last,day())-(new Date().getDay()%6?1:0);if(m>0)S.honor=Math.max(0,S.honor-Math.min(10,m*2));S.pen=day()}save()}
var T=[["подготовка",[["идея и название","t",30],["сценарий","t",40],["список бирол","t",30],["сюжет и сценки: как показать мысль каждой главы","t",40],["переходы между главами","t",40]]],
["съемка",[["говорящая голова","s"],["домашние биролы","s"],["уличные биролы (нужен помощник)","s"]]],
["монтаж",[["сброс на комп","s"],["нарезка головы","t",60],["начальная сценка и крутые моменты","t",60],["переходы","t",45],["саунддизайн","t",45],["вставка бирол","t",60],["музыка","t",40],["цветокоррекция","t",45]]],
["финал",[["рендер","d"],["превью","d"],["выкладка","d"]]]];
function mk(n,dt){return{id:id(),n:n,date:dt,groups:T.map(function(g){return{id:id(),n:g[0],tasks:g[1].map(function(t){return{id:id(),n:t[0],y:t[1],m:t[2]||0,done:0}})}})}}
function cur(){for(var v of S.videos)for(var g of v.groups)for(var t of g.tasks)if(!t.done)return{v:v,g:g,t:t};return null}
function st(){var a=0,d=0;S.videos.forEach(function(v){v.groups.forEach(function(g){g.tasks.forEach(function(t){a++;if(t.done)d++})})});return{a:a,d:d}}
function fin(t,g){lg();t.done=1;S.honor=Math.min(100,S.honor+4);var L=lg();L.d++;L.m+=t.m||0;S.last=day();if(g.tasks.every(function(x){return x.done}))S.anim=g.id}
function skip(c){lg();S.honor=Math.max(0,S.honor-3);var a=c.g.tasks,i=a.indexOf(c.t);if(i<a.length-1){a.splice(i,1);a.splice(i+1,0,c.t)}}
function fnd(i){for(var v of S.videos)for(var g of v.groups)for(var t of g.tasks)if(t.id==i)return{v:v,g:g,t:t}}
var PL='<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
var STAR='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.2 1.2-6.5-4.8-4.6 6.6-.9z"/></svg>';
function hdr(t){return'<div class="top"><h1>'+t+'</h1><div class="bt"><button class="rb" data-a="idea">'+PL+'</button><button class="rb" data-a="theme"><span class="ht"></span></button></div></div>'}
function hc(h){return"rgb("+Math.round(190+65*h/100)+","+Math.round(20+235*h/100)+","+Math.round(80+175*h/100)+")"}
function hon(){var p=S.ph==null?S.honor:S.ph;return'<div class="hl">честь</div><div class="hon"><div class="trk"></div><div class="kn" style="left:calc((100% - 48px)*'+p/100+');color:'+hc(p)+'">'+STAR+'</div></div>'}
function lab(t){return t.y=="t"?"начать":t.n=="сброс на комп"?"выполнено":t.y=="s"?"снято":"готово"}
function dform(){var x=new Date();x.setDate(x.getDate()+14);return'<input id="nn" placeholder="название"><input id="nd" type="date" value="'+day(x)+'">'}
function today(){var c=cur(),s=st(),dt=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"}),h=hdr(dt)+hon();
if(!c)h+='<div class="main" id="mc"><div class="fm"><div>'+dform()+'<span class="cn" data-a="nx">отмена</span></div></div><button class="go" data-a="newv">новое видео</button></div>';
else{h+='<div class="main"><div class="lb">сейчас</div><div class="big">'+esc(c.t.n)+'</div><div class="sb">'+esc(c.v.n)+' · '+c.g.n+(c.t.y=="t"?' · '+c.t.m+' мин':'')+'</div><button class="go" data-a="go">'+lab(c.t)+'</button></div>';
var dl=c.v.date?Math.ceil((new Date(c.v.date)-new Date(day()))/864e5):null;
h+='<div class="tl"><div class="tile"><span>шагов</span><b>'+s.d+' из '+s.a+'</b></div><div class="tile"><span>до выхода</span><b>'+(dl===null?"-":dl+" дн")+'</b></div></div>'}
return h+'<div class="lk"><a data-a="all">видео</a><a data-a="end">завершить день</a></div>'}
function vid(){var h=hdr("видео")+'<button class="pill w" data-a="back">назад</button><button class="pill" data-a="newv2">новое видео</button><button class="pill" data-a="addt">+ задача</button>';
S.videos.forEach(function(v){var left=0;v.groups.forEach(function(g){g.tasks.forEach(function(t){if(!t.done)left++})});
var pd=v.date&&left?Math.ceil(left/Math.max(1,wd(day(),v.date))*10)/10:0;
h+='<div class="vh"><b>'+esc(v.n)+'</b><small data-a="rp" data-id="'+v.id+'">'+(v.date?v.date.slice(5)+" · ":"")+left+' шагов'+(pd?' · ~'+pd+'/день':'')+'</small></div>';
v.groups.forEach(function(g){var d=g.tasks.every(function(t){return t.done}),an=S.anim==g.id;
h+='<div class="g'+(d&&!an?' d':'')+'" data-g="'+g.id+'"><div class="gn"><span>'+g.n+'</span><span class="mu">'+(d?'готово':g.tasks.filter(function(t){return t.done}).length+'/'+g.tasks.length)+'</span></div>';
g.tasks.forEach(function(t){h+='<div class="row'+(t.done?' x':'')+'" data-a="tg" data-id="'+t.id+'"><i class="ck"></i><span>'+esc(t.n)+'</span>'+(t.y=="t"?'<small class="mu">'+t.m+'м</small>':'')+'<b data-a="del" data-id="'+t.id+'">×</b></div>'});h+='</div>'})});
if(!S.videos.length)h+='<p class="mu" style="padding:20px 4px">пока пусто</p>';return h}
function mmss(ms){ms=Math.max(0,Math.ceil(ms/1000));return("0"+Math.floor(ms/60)).slice(-2)+":"+("0"+ms%60).slice(-2)}
function tim(){var X=S.timer,c=cur(),w=X.k=="w",h=hdr(w?"таймер":"перерыв")+'<div class="tc mu">'+(w&&c?esc(c.t.n):"выдохни")+'</div>';
if(X.fin)return h+'<div class="tm sm">'+(w?"время вышло":"перерыв закончился")+'</div><div class="tc">'+(w?'<button class="pill" data-a="tb">перерыв</button><button class="pill w" data-a="td">выполнено</button><button class="pill" data-a="tn">не сегодня</button>':'<button class="pill w" data-a="tx">продолжить</button>')+'</div>';
return h+'<div class="tm" id="tm">'+mmss(X.p!=null?X.p:X.end-Date.now())+'</div><div class="tc"><button class="pill" data-a="tp5">+ 5 мин</button><button class="pill" data-a="tpa">'+(X.p!=null?"продолжить":"пауза")+'</button></div><div class="tc">'+(w?'<button class="pill w" data-a="td">завершить</button>':'')+'<button class="pill" data-a="tx">на главную</button></div>'}
function R(){document.documentElement.dataset.theme=S.theme;var m=document.querySelector("meta[name=theme-color]");if(m)m.content=S.theme=="dark"?"#000000":"#f2f2f7";
document.documentElement.classList.toggle("ns",!S.timer&&S.view!="all");
A.innerHTML=(S.timer?tim():S.view=="all"?vid():today())+'<div class="cp">sixteendope ©</div>';
A.classList.remove("i");void A.offsetWidth;A.classList.add("i");
var k=A.querySelector(".kn");if(k&&S.ph!=null&&S.ph!=S.honor){var hv=S.honor;setTimeout(function(){k.style.left="calc((100% - 48px)*"+hv/100+")";k.style.color=hc(hv)},400)}S.ph=S.honor;
if(S.anim){var g=A.querySelector('[data-g="'+S.anim+'"]');S.anim=null;if(g)setTimeout(function(){g.classList.add("d")},350)}}
function nav(f){if(busy)return;busy=1;A.classList.add("o");setTimeout(function(){f();save();R();A.classList.remove("o");busy=0},230)}
function pop(h){var o=document.createElement("div");o.className="po";o.dataset.a="cl";o.innerHTML='<div class="pi">'+h+'</div>';document.body.appendChild(o);requestAnimationFrame(function(){requestAnimationFrame(function(){o.classList.add("on")})})}
function cl(){var s=document.querySelector(".po:not(.out)");if(s){s.classList.add("out");s.classList.remove("on");s.querySelectorAll("[id]").forEach(function(e){e.removeAttribute("id")});setTimeout(function(){s.remove()},400)}}
function chg(f){cl();nav(f)}
function v(i){var e=document.getElementById(i);return e?e.value.trim():""}
function ideasH(){var h='<h2>идея</h2><input id="iv" placeholder="что пришло в голову"><button class="pill w" data-a="ia">записать</button>';S.ideas.forEach(function(x,i){h+='<div class="ln"><span>'+esc(x)+'</span><span class="mu" data-a="id" data-id="'+i+'">×</span></div>'});return h}
var D={
theme:function(){S.theme=S.theme=="dark"?"light":"dark"},
all:function(){S.view="all"},back:function(){S.view="today"},
go:function(){var c=cur();if(!c)return;if(c.t.y=="t"){S.timer={k:"w",end:Date.now()+c.t.m*6e4,m:c.t.m};try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}else fin(c.t,c.g)},
tp5:function(){var X=S.timer;if(X.p!=null)X.p+=3e5;else X.end+=3e5;X.m+=5;var el=document.getElementById("tm");if(el)el.textContent=mmss(X.p!=null?X.p:X.end-Date.now())},
tpa:function(e){var X=S.timer;if(X.p==null)X.p=Math.max(0,X.end-Date.now());else{X.end=Date.now()+X.p;X.p=null}e.textContent=X.p!=null?"продолжить":"пауза"},
tx:function(){S.timer=null},
td:function(){var c=cur();if(c)fin(c.t,c.g);S.timer=null},
tn:function(){var c=cur();if(c)skip(c);S.timer=null},
tb:function(){S.timer={k:"b",end:Date.now()+6e5}},
tg:function(e){var f=fnd(e.dataset.id);if(!f)return;if(f.t.done)f.t.done=0;else fin(f.t,f.g)},
del:function(e){var f=fnd(e.dataset.id);if(f&&confirm("удалить?"))f.g.tasks.splice(f.g.tasks.indexOf(f.t),1)},
idea:function(){pop(ideasH())},
ia:function(){var x=v("iv");if(x)S.ideas.unshift(x);document.querySelector(".po .pi").innerHTML=ideasH()},
id:function(e){S.ideas.splice(+e.dataset.id,1);document.querySelector(".po .pi").innerHTML=ideasH()},
newv:function(e){var m=document.getElementById("mc");if(!m)return;if(!m.classList.contains("open")){m.classList.add("open");e.textContent="создать";setTimeout(function(){var i=document.getElementById("nn");if(i)i.focus()},450);return}
var n=v("nn");if(!n){document.getElementById("nn").focus();return}var d=document.getElementById("nd").value;nav(function(){S.videos.push(mk(n,d))})},
nx:function(){var m=document.getElementById("mc");m.classList.remove("open");m.querySelector(".go").textContent="новое видео"},
newv2:function(){pop('<h2>новое видео</h2>'+dform()+'<button class="pill w" data-a="nc2">создать</button>')},
nc2:function(){var n=v("nn");if(!n)return;var d=document.getElementById("nd").value;chg(function(){S.videos.push(mk(n,d))})},
rp:function(e){pop('<h2>пересобрать план</h2><p class="mu">новая дата выхода, остальные шаги разделятся по дням</p><input id="nd" type="date" value="'+day()+'"><button class="pill w" data-a="rc" data-id="'+e.dataset.id+'">готово</button>')},
rc:function(e){var d=document.getElementById("nd").value,i=e.dataset.id;chg(function(){S.videos.forEach(function(x){if(x.id==i)x.date=d})})},
addt:function(){pop('<h2>новая задача</h2><input id="an" placeholder="что сделать"><select id="ay"><option value="t">с таймером</option><option value="s">одним тапом</option><option value="d">на день</option></select><input id="am" type="number" value="30" placeholder="минут"><button class="pill w" data-a="ac">добавить</button>')},
ac:function(){var n=v("an");if(!n)return;var y=document.getElementById("ay").value,m=+document.getElementById("am").value||30;chg(function(){var o=S.videos.filter(function(x){return x.id=="own"})[0];if(!o){o={id:"own",n:"свои задачи",date:"",groups:[{id:id(),n:"задачи",tasks:[]}]};S.videos.unshift(o)}o.groups[0].tasks.push({id:id(),n:n,y:y,m:m,done:0})})},
end:function(){var L=lg(),s=st(),c=cur(),dl=c&&c.v.date?Math.ceil((new Date(c.v.date)-new Date(day()))/864e5):null;
