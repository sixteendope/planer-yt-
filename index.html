<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.2,1.25,.35,1);
  --r-xl:32px; --r-lg:26px; --r-md:20px;
  --danger:#d0416b;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000; --text:#f5f5f3; --muted:#8a8a86; --faint:#565652;
  --card:#161616; --card-2:#1e1e1e; --line:rgba(255,255,255,.085);
  --glow:rgba(255,255,255,.13);
  --white:#f4f4f1; --on-white:#080808; --on-white-muted:#78786f; --white-line:rgba(0,0,0,.14);
  --white-field:rgba(0,0,0,.055);
  --card-btn:#0b0b0b; --card-btn-text:#f7f7f4;
  --card-chip-bg:#0b0b0b; --card-chip-text:#f7f7f4;
  --card-scheme:light;
  --pill:#f4f4f1; --pill-text:#080808; --pill-soft:rgba(0,0,0,.14);
  --field:rgba(255,255,255,.065);
  --fab:rgba(30,30,30,.82); --fab-border:rgba(255,255,255,.08); --fab-solid:#f4f4f1; --fab-solid-text:#080808;
  --ring-on:#f5f5f3; --ring-off:rgba(255,255,255,.13);
  --sheet:#141414; --sheet-text:#f5f5f3; --sheet-muted:#8e8e88; --sheet-field:rgba(255,255,255,.075); --sheet-line:rgba(255,255,255,.09);
  --shadow:0 24px 70px rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.62);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f1ed; --text:#0a0a0a; --muted:#73736d; --faint:#a3a39b;
  --card:#e4e4de; --card-2:#dcdcd5; --line:rgba(0,0,0,.085);
  --glow:rgba(0,0,0,.12);
  --white:#0d0d0d; --on-white:#f7f7f4; --on-white-muted:#979791; --white-line:rgba(255,255,255,.16);
  --white-field:rgba(255,255,255,.08);
  --card-btn:#f7f7f4; --card-btn-text:#0a0a0a;
  --card-chip-bg:#f7f7f4; --card-chip-text:#0a0a0a;
  --card-scheme:dark;
  --pill:#0d0d0d; --pill-text:#f7f7f4; --pill-soft:rgba(255,255,255,.16);
  --field:rgba(0,0,0,.055);
  --fab:rgba(252,252,248,.86); --fab-border:rgba(0,0,0,.08); --fab-solid:#111; --fab-solid-text:#f7f7f4;
  --ring-on:#0b0b0b; --ring-off:rgba(0,0,0,.12);
  --sheet:#fff; --sheet-text:#0a0a0a; --sheet-muted:#77776f; --sheet-field:rgba(0,0,0,.05); --sheet-line:rgba(0,0,0,.08);
  --shadow:0 24px 70px rgba(0,0,0,.12);
  --scrim:rgba(30,30,26,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{
  margin:0;min-height:100svh;background:var(--bg);color:var(--text);
  font-family:var(--font);letter-spacing:-.03em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .35s ease,color .35s ease;overflow-x:hidden;
  overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;left:-20%;right:-20%;top:-24%;height:72vh;z-index:0;pointer-events:none;
  background:radial-gradient(50% 52% at 50% 40%,var(--glow),transparent 76%);
  opacity:.75;transition:background .35s;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
h1,h2,h3,p{margin:0}
svg{display:block}
:focus-visible{outline:2px solid var(--muted);outline-offset:3px}
.shell{
  position:relative;z-index:2;width:100%;max-width:540px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
}
.head{min-height:92px;padding-right:152px;display:flex;align-items:flex-end}
.head h1{font-size:40px;line-height:.94;font-weight:800;letter-spacing:-.045em;word-break:break-word;animation:softBlur .5s var(--ease) both}
.head-sub{margin-top:9px;font-size:17px;line-height:1.1;font-weight:600;color:var(--muted);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fabs{position:fixed;top:calc(41px + env(safe-area-inset-top));right:16px;z-index:70;display:flex;gap:8px}
.fab{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:var(--fab);border:1px solid var(--fab-border);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .25s var(--ease),background-color .3s,color .3s;
}
.fab svg{width:20px;height:20px}
.fab:active{transform:scale(.92)}
.fab.solid{background:var(--fab-solid);color:var(--fab-solid-text);border-color:transparent;box-shadow:0 0 26px var(--glow)}
.fab.solid svg{width:19px;height:19px}
.theme-fab svg{width:21px;height:21px;transition:transform .5s var(--ease)}
html[data-theme="light"] .theme-fab svg{transform:rotate(180deg)}
.back-pill{
  display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 15px 0 11px;margin-top:16px;
  background:var(--card);border-radius:999px;font-size:13.5px;font-weight:650;color:var(--text);
  transition:transform .2s,background-color .3s;
}
.back-pill svg{width:13px;height:13px}
.back-pill:active{transform:scale(.96)}
.view{display:block;animation:viewIn .34s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.honor{background:var(--card);border-radius:28px;padding:18px 20px 20px;margin-top:18px}
.honor-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.honor-name{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted)}
.honor-name svg{width:12px;height:12px;opacity:.8}
.honor-right{display:flex;align-items:baseline;gap:7px}
.honor-value{font-size:21px;font-weight:780;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.honor-delta{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.honor-delta.up{color:var(--text);text-shadow:0 0 12px var(--glow)}
.honor-delta.down{color:var(--danger)}
.honor-track{position:relative;height:5px;border-radius:999px;background:var(--line);margin-top:16px}
.honor-track::before{
  content:"";position:absolute;inset:0;border-radius:999px;opacity:.5;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(255,255,255,.2) calc(10% - 1px),rgba(255,255,255,.2) 10%);
}
html[data-theme="light"] .honor-track::before{background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.22) calc(10% - 1px),rgba(0,0,0,.22) 10%)}
.honor-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;width:66%;background:linear-gradient(90deg,var(--muted),var(--text));box-shadow:0 0 14px var(--glow);transition:width .8s var(--ease),background .35s}
.honor-knob{
  position:absolute;top:50%;left:66%;width:25px;height:25px;border-radius:50%;transform:translate(-50%,-50%);
  display:grid;place-items:center;background:#181818;color:#fff;
  border:1.6px solid rgba(255,255,255,.88);box-shadow:0 0 0 4px var(--card),0 0 20px var(--glow);
  transition:left .8s var(--ease),color .35s,border-color .35s,box-shadow .35s;
}
.honor-knob svg{width:10px;height:10px;filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
.honor.is-down .honor-knob{background:#181818;color:var(--danger);border-color:var(--danger);box-shadow:0 0 0 4px var(--card),0 0 18px rgba(208,65,107,.28)}
.honor.is-down .honor-knob svg{filter:drop-shadow(0 0 5px rgba(208,65,107,.5))}
.honor.is-down .honor-fill{background:linear-gradient(90deg,var(--muted),#7d2b47);box-shadow:0 0 14px rgba(208,65,107,.2)}
.white-card{
  color-scheme:var(--card-scheme);
  margin-top:12px;background:var(--white);color:var(--on-white);border-radius:var(--r-xl);
  padding:22px 20px;box-shadow:var(--shadow);position:relative;
  transition:background-color .35s,color .35s;
}
.white-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:16px}
.eyebrow{font-size:12px;font-weight:750;color:var(--on-white-muted);letter-spacing:-.005em}
.type-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;color:var(--on-white-muted);white-space:nowrap}
.type-chip svg{width:12px;height:12px}
.white-card.nextable{cursor:pointer}
.white-card{animation:cardSwap .5s var(--ease) both}
@keyframes cardSwap{from{opacity:0;filter:blur(12px);transform:translateY(12px) scale(.994)}to{opacity:1;filter:blur(0);transform:none}}
.white-title{
  margin-top:15px;font-size:clamp(32px,9.4vw,41px);line-height:1;font-weight:790;
  letter-spacing:-.045em;overflow-wrap:anywhere;text-wrap:balance;
}
.white-title.small-title{font-size:clamp(27px,7.6vw,33px);line-height:1.04}
.white-sub{margin-top:9px;font-size:14px;line-height:1.3;font-weight:600;color:var(--on-white-muted);overflow-wrap:anywhere}
.white-rule{height:1px;background:var(--white-line);margin:20px 0 16px}
.white-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.white-cols span{display:block;font-size:11.5px;font-weight:700;color:var(--on-white-muted);margin-bottom:6px;letter-spacing:-.01em}
.white-cols b{display:block;font-size:18px;font-weight:750;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums}
.card-btn{
  width:100%;height:54px;border-radius:999px;background:var(--card-btn);color:var(--card-btn-text);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;
  font-size:16px;font-weight:700;letter-spacing:-.03em;transition:transform .2s var(--ease),opacity .2s;
}
.card-btn svg{width:17px;height:17px}
.card-btn:active{transform:scale(.975)}
.card-btn.soft{background:var(--white-field);color:var(--on-white)}
.under-link{display:block;margin:13px auto 0;font-size:12px;font-weight:650;color:var(--on-white-muted);padding:2px 8px}
.timer-line{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--white-field);border-radius:20px;padding:11px 12px;margin-top:18px}
.timer-num{font-size:30px;font-weight:790;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums}
.timer-controls{display:flex;gap:6px}
.timer-controls button{width:34px;height:34px;border-radius:50%;background:var(--card-chip-bg);color:var(--card-chip-text);font-size:11px;font-weight:700;display:grid;place-items:center}
.wide-card{
  width:100%;display:flex;align-items:center;gap:15px;text-align:left;
  background:var(--card);border-radius:30px;padding:16px;margin-top:12px;
  transition:background-color .3s,transform .2s;
}
.wide-card:active{transform:scale(.985)}
.donut{width:66px;height:66px;border-radius:50%;flex:0 0 auto;position:relative;display:grid;place-items:center}
.donut-hole{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11.5px;font-weight:750;letter-spacing:-.04em;position:relative;z-index:2;font-variant-numeric:tabular-nums}
.wide-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wide-copy small{font-size:11.5px;font-weight:700;color:var(--muted)}
.wide-copy b{font-size:17px;font-weight:740;letter-spacing:-.04em;line-height:1.1}
.wide-card>svg{width:16px;height:16px;color:var(--faint);flex:0 0 auto}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px}
.links button{font-size:17px;font-weight:750;letter-spacing:-.045em;padding:10px 4px;color:var(--text);text-shadow:0 0 16px var(--glow),0 0 30px var(--glow);transition:transform .2s,opacity .2s}
.links button:active{transform:scale(.97);opacity:.7}
.idea-line{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:5px 5px 5px 17px;margin-top:14px}
.idea-line input{flex:1;min-width:0;height:40px;background:none;border:0;outline:none;color:var(--text);font-size:16px;font-weight:550;letter-spacing:-.025em}
.idea-line input::placeholder{color:var(--faint)}
.idea-line button{width:38px;height:38px;border-radius:50%;flex:0 0 auto;background:var(--pill);color:var(--pill-text);display:grid;place-items:center;transition:transform .2s}
.idea-line button:active{transform:scale(.92)}
.idea-line button svg{width:16px;height:16px}
footer{margin-top:36px;text-align:center}
.copy{font-size:13px;font-weight:600;color:var(--faint);letter-spacing:-.015em;padding:6px 10px}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.task{background:var(--card);border-radius:26px;overflow:hidden;transition:background-color .3s}
.task.is-done{opacity:.62}
.task-row{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:14px 15px;min-height:76px}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:var(--pill);color:var(--pill-text);font-size:17px;font-weight:750;letter-spacing:-.04em;
  box-shadow:0 0 18px var(--glow);
}
.avatar svg{width:18px;height:18px}
.task-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.task-copy b{font-size:16px;font-weight:690;letter-spacing:-.04em;line-height:1.16;overflow-wrap:anywhere}
.task-meta{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-chev{flex:0 0 auto;color:var(--faint);transition:transform .3s var(--ease)}
.task-chev svg{width:16px;height:16px}
.task.expanded .task-chev{transform:rotate(180deg)}
.steps{max-height:0;opacity:0;overflow:hidden;transition:max-height .4s var(--ease),opacity .28s ease}
.task.expanded .steps{max-height:4000px;opacity:1}
.steps-in{border-top:1px solid var(--line);padding:4px 15px 8px}
.step{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);min-height:46px}
.step:last-of-type{border-bottom:0}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:0 0 auto;display:grid;place-items:center;color:var(--bg);transition:all .2s}
.tick svg{width:11px;height:11px}
.step.done .tick{background:var(--text);border-color:var(--text);color:var(--bg)}
.step-copy{flex:1;min-width:0;text-align:left;font-size:14px;line-height:1.25;font-weight:600;letter-spacing:-.025em;color:var(--text);padding:3px 0}
.step.done .step-copy{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.step-note{display:block;font-size:10.5px;font-weight:550;color:var(--muted);margin-top:4px;text-decoration:none}
.step-play{width:32px;height:32px;border-radius:50%;background:var(--field);color:var(--text);display:grid;place-items:center;flex:0 0 auto}
.step-play svg{width:12px;height:12px}
.step-time{font-size:10.5px;font-weight:650;color:var(--faint);flex:0 0 auto;font-variant-numeric:tabular-nums}
.tools{display:flex;justify-content:center;gap:18px;padding:12px 0 4px}
.tools button{font-size:11.5px;font-weight:650;color:var(--muted);padding:4px}
.tools button.danger{color:var(--danger)}
.queue-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 4px 2px}
.queue-head span{font-size:13px;font-weight:750;color:var(--muted);letter-spacing:-.02em}
.queue-head button{font-size:12.5px;font-weight:700;color:var(--muted)}
.queue-row{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;min-height:64px;text-align:left}
.queue-icon{width:36px;height:36px;border-radius:50%;background:var(--field);color:var(--text);display:grid;place-items:center;flex:0 0 auto}
.queue-icon svg{width:14px;height:14px}
.queue-copy{flex:1;min-width:0}
.queue-copy b{display:block;font-size:14px;font-weight:650;line-height:1.22;letter-spacing:-.03em;overflow-wrap:anywhere}
.queue-copy small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.queue-date{font-size:11px;font-weight:650;color:var(--faint);white-space:nowrap;flex:0 0 auto}
.thin-link{display:block;margin:18px auto 0;font-size:12.5px;font-weight:650;color:var(--muted);padding:4px}
.plan-links{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:14px}
.plan-links .thin-link{margin:0}
.idea-row{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:24px;padding:14px 13px 14px 16px;animation:viewIn .3s var(--ease) both}
.idea-copy{flex:1;min-width:0}
.idea-copy p{font-size:14.5px;font-weight:620;line-height:1.32;letter-spacing:-.03em;overflow-wrap:anywhere}
.idea-copy span{display:block;font-size:11px;font-weight:600;color:var(--faint);margin-top:5px}
.idea-btn{width:34px;height:34px;border-radius:50%;background:var(--field);color:var(--muted);display:grid;place-items:center;flex:0 0 auto;transition:transform .2s}
.idea-btn:active{transform:scale(.92)}
.idea-btn svg{width:14px;height:14px}
.empty{background:var(--card);border-radius:28px;padding:26px 20px;text-align:center;margin-top:18px}
.empty h3{font-size:17px;font-weight:730;letter-spacing:-.04em}
.empty p{font-size:13px;font-weight:550;color:var(--muted);line-height:1.4;margin:8px auto 0;max-width:250px}
.empty .card-btn{margin-top:18px}
.mini{
  position:fixed;z-index:80;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(calc(100% - 32px),380px);background:var(--pill);color:var(--pill-text);border-radius:999px;
  padding:7px 7px 7px 17px;display:flex;align-items:center;gap:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.4),0 0 30px var(--glow);animation:miniIn .35s var(--spring) both;
}
@keyframes miniIn{from{opacity:0;transform:translate(-50%,14px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.mini-time{font-size:15px;font-weight:790;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1}
.mini-label{font-size:10.5px;font-weight:600;opacity:.62;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.mini-copy{flex:1;min-width:0}
.mini button{width:36px;height:36px;border-radius:50%;background:var(--pill-soft);color:inherit;display:grid;place-items:center;flex:0 0 auto}
.mini button.solid{background:var(--pill-text);color:var(--pill)}
.mini button svg{width:14px;height:14px}
.modal-root{position:fixed;inset:0;z-index:100;pointer-events:none}
.modal-root:not(:empty){pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .22s ease both;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:520px;background:var(--sheet);color:var(--sheet-text);
  border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:92dvh;overflow-y:auto;animation:sheetUp .38s var(--ease) both;
  box-shadow:0 -20px 70px rgba(0,0,0,.35);
}
@keyframes sheetUp{from{opacity:.4;transform:translateY(44px)}to{opacity:1;transform:none}}
.grab{width:34px;height:4px;border-radius:99px;background:var(--sheet-line);margin:0 auto 16px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.sheet-head h2{font-size:25px;line-height:1.03;font-weight:780;letter-spacing:-.055em}
.sheet-head p{font-size:12.5px;font-weight:600;color:var(--sheet-muted);margin-top:6px;line-height:1.3}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--sheet-field);color:var(--sheet-muted);display:grid;place-items:center;flex:0 0 auto}
.sheet-close svg{width:14px;height:14px}
.field{margin-top:12px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--sheet-muted);margin:0 4px 7px}
.input{
  display:block;width:100%;max-width:100%;min-width:0;min-height:52px;border-radius:16px;
  border:1px solid transparent;background:var(--sheet-field);
  color:var(--sheet-text);font-size:16px;font-weight:550;letter-spacing:-.025em;padding:12px 15px;outline:none;
  transition:border-color .2s,background .2s;
  -webkit-appearance:none;appearance:none;
}
.input[type="date"]{text-align:left;line-height:normal}
.input[type="date"]::-webkit-date-and-time-value{text-align:left;min-width:0}
.input[type="number"]{text-align:left}
.white-card{overflow:hidden}
textarea.input{min-height:96px;resize:vertical;line-height:1.4}
.input:focus{border-color:var(--sheet-line);background:var(--sheet-field)}
.input::placeholder{color:var(--sheet-muted);opacity:.65}
.white-card .input::placeholder{color:var(--on-white-muted);opacity:.8}
.white-card .error{color:var(--danger)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sheet-field);border-radius:999px;padding:4px}
.seg button{height:38px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--sheet-muted);transition:all .22s}
.seg button.active{background:var(--sheet-text);color:var(--sheet)}
.row-2{display:flex;gap:8px}
.row-2>*{flex:1;min-width:0}
.actions{display:flex;gap:7px;margin-top:20px}
.actions button{flex:1;min-width:0;height:50px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;padding:0 8px;transition:transform .2s,opacity .2s}
.actions button:active{transform:scale(.975)}
.actions .primary{background:var(--sheet-text);color:var(--sheet);flex:1.6}
.actions .secondary{background:var(--sheet-field);color:var(--sheet-text)}
.actions .danger{background:rgba(208,65,107,.14);color:var(--danger);flex:0 0 auto;padding:0 18px}
.actions .square{flex:0 0 50px;padding:0}
.hint{font-size:11px;line-height:1.45;font-weight:550;color:var(--sheet-muted);margin-top:12px;text-align:center}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.sum{background:var(--sheet-field);border-radius:18px;padding:12px 14px}
.sum small{display:block;font-size:10.5px;font-weight:650;color:var(--sheet-muted);margin-bottom:6px}
.sum b{font-size:18px;font-weight:760;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.sum b em{font-style:normal;font-size:11px;font-weight:600;color:var(--sheet-muted);margin-left:4px}
.timer-sheet{text-align:center;padding-top:4px}
.timer-sheet .sheet-head{text-align:left}
.timer-sheet .big-time{font-size:52px;font-weight:790;letter-spacing:-.065em;line-height:1;font-variant-numeric:tabular-nums;margin:14px 0 6px}
.timer-sheet p{font-size:12.5px;font-weight:600;color:var(--sheet-muted);line-height:1.4;margin-bottom:16px;overflow-wrap:anywhere}
.error{display:none;font-size:11.5px;font-weight:600;color:var(--danger);margin:9px 4px 0}
.error.show{display:block}
.toasts{position:fixed;z-index:120;left:0;right:0;bottom:calc(82px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{max-width:min(92vw,390px);background:var(--card-2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:12px;font-weight:600;letter-spacing:-.02em;line-height:1.3;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.32);animation:toastIn .3s var(--ease) both}
.toast.out{animation:toastOut .26s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.98)}}
body.is-booting .view{animation:none}
body.is-booting .head{animation:bootIn .6s var(--ease) both;animation-delay:.02s}
body.is-booting .honor{animation:bootIn .65s var(--ease) both;animation-delay:.08s}
body.is-booting .honor-knob{animation:knobIn .8s var(--spring) both;animation-delay:.5s}
body.is-booting .white-card{animation:cardIn .8s var(--ease) both;animation-delay:.16s}
body.is-booting .wide-card{animation:bootIn .65s var(--ease) both;animation-delay:.3s}
body.is-booting .links{animation:bootIn .65s var(--ease) both;animation-delay:.38s}
body.is-booting .idea-line{animation:bootIn .65s var(--ease) both;animation-delay:.44s}
body.is-booting footer{animation:bootIn .65s var(--ease) both;animation-delay:.42s}
body.is-booting .fabs .fab{animation:fabIn .5s var(--ease) both}
body.is-booting .fabs .fab:nth-child(1){animation-delay:.1s}
body.is-booting .fabs .fab:nth-child(2){animation-delay:.16s}
body.is-booting .fabs .fab:nth-child(3){animation-delay:.22s}
@keyframes bootIn{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes knobIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fabIn{from{opacity:0;transform:translateY(-8px) scale(.8)}to{opacity:1;transform:none}}
@media(max-width:380px){
  .shell{padding-left:14px;padding-right:14px}
  .head{min-height:86px;padding-right:138px}
  .head h1{font-size:35px}
  .head-sub{font-size:14.5px}
  .fabs{right:12px;gap:6px;top:calc(40px + env(safe-area-inset-top))}
  .fab{width:40px;height:40px}
  .fab svg{width:18px;height:18px}
  .semi{width:17px;height:19px}
  .white-card{padding:20px 17px;border-radius:28px}
  .white-title{font-size:clamp(29px,9.8vw,37px)}
  .honor{padding:16px 17px 18px}
  .links button{font-size:16px}
  .avatar{width:42px;height:42px;font-size:16px}
}
@media(min-width:760px){
  .shell{padding-top:28px}
  .fabs{top:53px;right:max(24px,calc(50% - 270px + 18px))}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:30px;max-height:86dvh;padding-bottom:24px}
}
/* плавные переходы между экранами */
.view{animation:viewBlur .5s var(--ease) both}
@keyframes viewBlur{from{opacity:0;filter:blur(14px);transform:translateY(14px) scale(.994)}to{opacity:1;filter:blur(0);transform:none}}
.screen-in .fabs .fab{animation:fabBlur .55s var(--ease) both}
.screen-in .fabs .fab:nth-child(2){animation-delay:.05s}
.screen-in .fabs .fab:nth-child(3){animation-delay:.1s}
.screen-in .head h1,.screen-in .head-sub{animation:softBlur .5s var(--ease) both}
.screen-in .head-sub{animation-delay:.05s}
@keyframes softBlur{from{opacity:0;filter:blur(10px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes fabBlur{from{opacity:0;filter:blur(9px);transform:scale(.84)}to{opacity:1;filter:blur(0);transform:none}}
.rows>.task,.rows>.queue-row,.rows>.idea-row,.queue-head,.plan-links,.empty{animation:viewBlur .45s var(--ease) both}
.rows>*:nth-child(2){animation-delay:.035s}
.rows>*:nth-child(3){animation-delay:.07s}
.rows>*:nth-child(4){animation-delay:.105s}
.rows>*:nth-child(5){animation-delay:.14s}
.rows>*:nth-child(n+6){animation-delay:.17s}
::view-transition-old(root){animation:vtOld .32s var(--ease) both}
::view-transition-new(root){animation:vtNew .45s var(--ease) both}
@keyframes vtOld{to{opacity:0;filter:blur(12px);transform:scale(.985)}}
@keyframes vtNew{from{opacity:0;filter:blur(16px);transform:translateY(16px) scale(.99)}to{opacity:1;filter:blur(0);transform:none}}
/* компактный первый экран, чтобы всё помещалось */
body.fit-view{overflow:hidden}
body.fit-view .shell{height:100svh;display:flex;flex-direction:column;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
body.fit-view main{flex:1;min-height:0;display:flex;flex-direction:column}
body.fit-view footer{margin-top:auto;padding-top:12px}
body.fit-view .head{min-height:74px}
body.fit-view .head h1{font-size:36px}
body.fit-view .head-sub{font-size:15.5px;margin-top:6px}
body.fit-view .honor{margin-top:14px;padding:15px 18px 17px}
body.fit-view .white-card{margin-top:10px;padding:18px 18px 16px}
body.fit-view .white-title{font-size:clamp(29px,8.6vw,36px)}
body.fit-view .white-rule{margin:14px 0 12px}
body.fit-view .card-btn{margin-top:14px;height:50px}
body.fit-view .under-link{margin-top:8px}
body.fit-view .wide-card{margin-top:9px;padding:11px 14px}
body.fit-view .donut{width:54px;height:54px}
body.fit-view .donut-hole{width:38px;height:38px;font-size:10px}
body.fit-view .links{margin-top:14px}
body.fit-view .links button{font-size:16px;padding:7px 4px}
body.fit-view .timer-line{margin-top:12px}
body.fit-view footer .copy{font-size:11.5px}
body.bare .honor,body.bare .links,body.bare .wide-card,body.bare .fabs{display:none!important}
body.running-now.fit-view .wide-card{display:none}
body.bare .shell{justify-content:flex-start}
body.bare main{display:flex;flex-direction:column;justify-content:center;padding-bottom:8vh}
.under-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.under-row .under-link{margin:0;font-size:12.5px}
.under-row .under-link.next{color:var(--on-white);display:inline-flex;align-items:center;gap:3px}
.under-row .under-link.next svg{width:12px;height:12px}
.reset-small{display:block;margin:22px auto 0;padding:6px 10px;font-size:11.5px;font-weight:650;color:var(--faint);transition:color .2s}
.reset-small:active{color:var(--danger)}
@media(max-height:760px){
  body.fit-view .head{min-height:64px}
  body.fit-view .head h1{font-size:32px}
  body.fit-view .honor{padding:12px 16px 14px;margin-top:10px}
  body.fit-view .white-card{padding:16px}
  body.fit-view .white-title{font-size:27px}
  body.fit-view .white-cols b{font-size:16px}
  body.fit-view .white-rule{margin:11px 0 10px}
  body.fit-view .card-btn{height:46px;margin-top:12px}
  body.fit-view .wide-card{padding:9px 12px}
  body.fit-view .links{margin-top:8px}
  body.fit-view .timer-num{font-size:26px}
  body.fit-view footer{margin-top:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

"use strict";
const KEY = "sixteendope.planner.v1";
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WEEKDAYS = ["вс","пн","вт","ср","чт","пт","сб"];
const uid = p => p + "_" + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const plural = (n, a, b, c) => {
  const x = Math.abs(n) % 100, y = x % 10;
  if (x > 10 && x < 20) return c;
  if (y > 1 && y < 5) return b;
  if (y === 1) return a;
  return c;
};
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoDate(new Date());
const parseISO = iso => { const p = String(iso).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2], 12, 0, 0, 0); };
const addDays = (d, n) => { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };

function startTask(taskId, stepId) {
  const entry = findEntry(taskId, stepId);
  if (!entry || entry.step.done) return;
  const { task, step } = entry;
  state.focus = step.id;
  if (state.skipped && state.skipped.date === todayISO()) {
    state.skipped.ids = state.skipped.ids.filter(id => id !== step.id);
  }
  markActive();
  if (state.breakUntil) state.breakUntil = null;
  if (task.type !== "timer") {
    completeStep(task.id, step.id);
    return;
  }
  if (state.running && state.running.stepId !== step.id) {
    state.running = null;
  }
  const minutes = Math.max(5, Number(task.minutes) || 35);
  state.running = {
    taskId: task.id,
    stepId: step.id,
    taskTitle: task.title,
    stepTitle: step.title,
    minutes,
    startedAt: Date.now(),
    endAt: Date.now() + minutes * 60000
  };
  ui.timerModalFor = null;
  save();
  requestWakeLock();
  setView("today");
  renderAll();
  toast("таймер · " + minutes + " мин");
}
function stopRunning() {
  state.running = null;
  releaseWakeLock();
}
function completeStep(taskId, stepId, actualMinutes) {
  const entry = findEntry(taskId, stepId);
  if (!entry || entry.step.done) return;
  const { task, step } = entry;
  if ((actualMinutes === undefined || actualMinutes === null) && state.running && state.running.stepId === step.id) {
    actualMinutes = Math.max(1, Math.min(state.running.minutes, Math.round((Date.now() - state.running.startedAt) / 60000)));
  }
  step.done = true;
  step.doneAt = new Date().toISOString();
  const minutes = actualMinutes === undefined || actualMinutes === null ? 0 : Math.max(0, Math.round(Number(actualMinutes) || 0));
  const log = logToday();
  log.done.push({ title: step.title, minutes });
  log.minutes = (Number(log.minutes) || 0) + minutes;
  adjustHonor(task.type === "shot" ? 3 : 2);
  if (state.running && state.running.stepId === step.id) stopRunning();
  if (state.focus === step.id) {
    const next = task.steps.find(s => !s.done);
    state.focus = next ? next.id : null;
  }
  markActive();
  const finishedTask = isDone(task);
  if (finishedTask) { ui.open.delete(task.id); ui.closed.delete(task.id); }
  save();
  const card = document.querySelector(`[data-task-card="${task.id}"]`);
  const collapse = finishedTask && card && card.classList.contains("expanded");
  if (collapse) {
    const steps = card.querySelector(".steps");
    steps.style.maxHeight = steps.scrollHeight + "px";
    requestAnimationFrame(() => { steps.style.maxHeight = "0px"; steps.style.opacity = "0"; });
    renderHonor(); renderMain(); renderProgress(); renderMini(); renderVideo();
    setTimeout(() => { renderAll(); toast("шаг готов. блок собран."); }, 300);
  } else {
    renderAll();
    toast("шаг готов");
  }
}
function finishRunning() {
  const run = state.running;
  if (!run) return;
  const entry = findEntry(run.taskId, run.stepId);
  if (!entry) { stopRunning(); save(); renderAll(); return; }
  const elapsed = Math.max(1, Math.min(run.minutes, Math.round((Date.now() - run.startedAt) / 60000)));
  closeSheet();
  completeStep(run.taskId, run.stepId, elapsed);
}
function skipCurrent(taskId, stepId) {
  const entry = findEntry(taskId, stepId);
  if (!entry) return;
  const id = entry.step.id;
  markActive();
  if (state.skipped.ids.includes(id)) { toast("уже отложено на сегодня"); return; }
  state.skipped.ids.push(id);
  const external = entry.step.helper || entry.step.weather;
  if (!external) {
    const n = Number(state.notToday) || 0;
    adjustHonor(n === 0 ? -1 : -2);
    state.notToday = n + 1;
  }
  if (state.running && state.running.stepId === id) stopRunning();
  if (state.focus === id) state.focus = null;
  save();
  closeSheet();
  renderAll();
  toast(external ? "подождёт погоду, остальное не блокирует" : "до завтра. без красного");
}
function startBreak() {
  state.breakUntil = Date.now() + 10 * 60000;
  state.running = null;
  releaseWakeLock();
  save();
  closeSheet();
  renderAll();
  toast("перерыв 10 минут");
}
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
}

      });

      const newTask = {
        id: uid("task"), phase: "моё", title, source: "custom", type: chosen, minutes,
        order: state.tasks.length + 10,
        steps: stepTitles.map(t => ({ id: uid("step"), title: t, done: false, doneAt: null, helper: false, weather: false }))

    }
    const valid = new Set(state.tasks.flatMap(t => t.steps.map(s => s.id)));
    if (state.focus && !valid.has(state.focus)) state.focus = null;
    markActive();
    save();
    closeSheet();
    renderAll();
    toast(task ? "сохранено" : "задача добавлена");
  });
  if (task) {
    $("#deleteTaskBtn").addEventListener("click", () => {
      closeSheet();

        state.tasks = state.tasks.filter(t => t.id !== task.id);
        if (state.running && state.running.taskId === task.id) stopRunning();
        if (task.steps.some(s => s.id === state.focus)) state.focus = null;
        markActive(); save(); renderAll(); toast("задача убрана");
      }, true);
    });
  }
}

  state.tasks = [...baseVideoTasks(), ...custom];
  state.video = { title: title || "новый ролик", releaseDate: defaultRelease() };
  state.running = null;
  state.focus = null;
  state.skipped = { date: todayISO(), ids: [] };
  state.notToday = 0;
  if (!Number(state.honor)) {
    state.honor = 50;
    state.honorStart = 50;
    if (state.dayLog) state.dayLog.honorStart = 50;
  }
  markActive();
  save();
  renderAll();
  setView("video");
}
function resetAll() {
  openConfirm("сбросить все данные?", "задачи, план и идеи исчезнут. останется пустое приложение.", "сбросить всё", () => {
    const theme = state.theme;
    closeSheet();
    try { localStorage.removeItem(KEY); } catch (e) {}
    releaseWakeLock();
    state = nakedState(theme);
    ui.open.clear();
    ui.closed.clear();
    ui.timerModalFor = null;
    save();
    renderAll();
    setView("today", { force: true });
    toast("всё чисто");
  }, true);
}

function makeIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#080808";
  ctx.fillRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2, outer = size * .28, inner = outer * .42;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const r = i % 2 === 0 ? outer : inner;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = "#f7f7f4";
  ctx.shadowColor = "rgba(255,255,255,.5)";
  ctx.shadowBlur = size * .05;
  ctx.fill();
  return c.toDataURL("image/png");
}
function setupPWA() {
  try {
    $("#appleIcon").href = makeIcon(180);
    const icon = makeIcon(512);
    const pageUrl = location.href.split("#")[0].split("?")[0];
    const manifest = {
      name: "планер ютуба", short_name: "планер", display: "standalone", orientation: "portrait",
      start_url: pageUrl, scope: pageUrl.replace(/[^/]*$/, ""), id: pageUrl,
      background_color: "#000000", theme_color: "#000000",
      icons: [{ src: icon, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (e) {}
}
function animateHonor() {
  const el = $("#honorValue");
  if (!el) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const target = Math.round(state.honor);
  const from = Math.max(0, target - 8);
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / 900);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = String(Math.round(from + (target - from) * eased));
    if (t < 1) requestAnimationFrame(frame); else el.textContent = String(target);
  }
  requestAnimationFrame(frame);
}

function tick() {
  const now = Date.now();
  if (state.lastOpen && state.lastOpen !== todayISO()) {
    rollover();
    renderAll();
  }
  if (state.running) {
    if (now >= state.running.endAt) {
      if (ui.timerModalFor !== state.running.startedAt && ui.booted && !$("#modalRoot").innerHTML) {
        renderMini();
        openTimerFinished();
      }
    } else {
      const main = $("#mainClock"), mini = $("#miniClock");
      if (main) main.textContent = fmt(state.running.endAt - now);
      if (mini) mini.textContent = fmt(state.running.endAt - now);
    }
  }
  if (state.breakUntil) {
    if (now >= state.breakUntil) {
      state.breakUntil = null;
      save();
      renderMini();
      toast("перерыв закончился");
    } else {
      const mini = $("#miniClock");
      if (mini) mini.textContent = fmt(state.breakUntil - now);
    }
  }
}
function finishBoot() {
  document.body.classList.remove("is-booting");
  ui.booted = true;
}

function addIdeaValue(value) {
  const text = String(value || "").trim();
  if (!text) return false;
  state.ideas.unshift({ id: uid("idea"), text, createdAt: new Date().toISOString() });
  save();
  renderHead();
  renderIdeas();
  return true;
}

document.addEventListener("click", event => {
  if (!(event.target instanceof Element)) return;
  const nav = event.target.closest("[data-nav]");
  if (nav) {
    setView(nav.dataset.nav);
    renderAll();
    return;
  }
  const target = event.target.closest("[data-act]");
  if (!target) return;
  const act = target.dataset.act;
  const taskId = target.dataset.task;
  const stepId = target.dataset.step;
  if (act === "close-sheet") { closeSheet(); return; }
  if (act === "none") return;
  if (act === "add") { openTaskEditor(); return; }
  if (act === "edit-task") { openTaskEditor(taskId); return; }
  if (act === "delete-task") {
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;
    openConfirm("удалить задачу?", "«" + task.title + "» исчезнет вместе с шагами.", "удалить", () => {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      if (state.running && state.running.taskId === taskId) stopRunning();
      if (task.steps.some(s => s.id === state.focus)) state.focus = null;
      markActive(); save(); renderAll(); toast("задача убрана");
    }, true);
    return;
  }
  if (act === "toggle") {
    const card = document.querySelector(`[data-task-card="${taskId}"]`);
    if (!card) return;
    const wasExpanded = card.classList.contains("expanded");
    if (wasExpanded) { card.classList.remove("expanded"); ui.open.delete(taskId); ui.closed.add(taskId); }
    else { card.classList.add("expanded"); ui.open.add(taskId); ui.closed.delete(taskId); }
    return;
  }
  if (act === "next") { nextEntry(); return; }
  if (act === "reset-all") { resetAll(); return; }
  if (act === "start") { startTask(taskId, stepId); return; }
  if (act === "complete") { completeStep(taskId, stepId); return; }
  if (act === "not-today") { skipCurrent(taskId, stepId); return; }
  if (act === "finish-early" || act === "finish-running" || act === "timer-done") { finishRunning(); return; }
  if (act === "timer-break") { startBreak(); return; }
  if (act === "timer-skip") {
    if (state.running) skipCurrent(state.running.taskId, state.running.stepId);
    else closeSheet();
    return;
  }
  if (act === "adjust") {
    if (!state.running) return;
    const delta = Number(target.dataset.delta) || 5;
    const now = Date.now();
    const base = Math.max(now, state.running.endAt);
    state.running.endAt = Math.max(now + 60000, base + delta * 60000);
    state.running.minutes = Math.max(1, Math.round((state.running.endAt - state.running.startedAt) / 60000));
    save(); renderMain(); renderMini();
    toast((delta > 0 ? "+" + delta : delta) + " мин");
    return;
  }
  if (act === "break-end") {
    state.breakUntil = null; save(); renderMini(); return;
  }
  if (act === "break-home") {
    state.breakUntil = null; save(); setView("today"); renderAll(); return;
  }
  if (act === "go-today") { setView("today"); renderAll(); return; }
  if (act === "end-day") { openEndDay(); return; }
  if (act === "replan") { openVideoEditor("replan"); return; }
  if (act === "edit-video") { openVideoEditor("edit"); return; }
  if (act === "new-video") {
    if (!state.video) {
      setView("video");
      renderAll();
      return;
    }
    openConfirm("начать другой ролик?", "шаги текущего плана заменятся. свои задачи и идеи останутся.", "начать", () => {
      state.tasks = state.tasks.filter(t => t.source !== "video");
      state.video = null;
      state.running = null;
      state.focus = null;
      markActive(); save(); renderAll(); setView("video");
      toast("впиши название и дату");
    }, false);
    return;
  }
  if (act === "idea-del") {
    state.ideas = state.ideas.filter(i => i.id !== target.dataset.idea);
    save(); renderHead(); renderIdeas();
    return;
  }
  if (act === "idea-plan") {
    const idea = state.ideas.find(i => i.id === target.dataset.idea);
    if (!idea) return;
    if (state.video && !(videoPct().total > 0 && videoPct().remaining === 0)) {
      toast("план уже идёт. идея подождёт");
      return;
    }
    createPlan(idea.text);
    toast("план собран. дату можно поменять");
    return;
  }
});

$("#themeBtn").addEventListener("click", () => {
  setTheme(state.theme === "dark" ? "light" : "dark");
});
$("#ideasBtn").addEventListener("click", () => {
  setView("ideas");
  renderAll();
  try { $("#ideasInput").focus({ preventScroll: true }); } catch (e) {}
});
$("#addBtn").addEventListener("click", () => openTaskEditor());
$("#backBtn").addEventListener("click", () => { setView("today"); renderAll(); });

$("#ideasForm").addEventListener("submit", event => {
  event.preventDefault();
  const input = $("#ideasInput");
  if (addIdeaValue(input.value)) { input.value = ""; toast("идея сохранена"); }
});
document.addEventListener("submit", event => {
  const form = event.target;
  if (form.id !== "videoForm") return;
  event.preventDefault();
  const title = $("#videoTitle").value.trim();
  const date = $("#videoDate").value;
  const error = $("#videoError");
  if (!title) {
    error.textContent = "нужно название.";
    error.classList.add("show");
    return;
  }
  if (!date || daysBetween(todayISO(), date) < 0) {
    error.textContent = "выбери день впереди.";
    error.classList.add("show");
    return;
  }
  createPlan(title);
  state.video.releaseDate = date;
  save();
  renderAll();
  setView("video");
  toast("план собран");
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeSheet();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (state.lastOpen && state.lastOpen !== todayISO()) {
    rollover(); renderAll();
  } else if (!$("#modalRoot").innerHTML) {
    renderHonor(); renderMain(); renderMini(); renderVideo();
  }
  if (state.running) requestWakeLock();
  tick();
});
window.addEventListener("focus", () => {
  if (state.lastOpen && state.lastOpen !== todayISO()) {
    rollover(); renderAll();
  }
  tick();
});
window.addEventListener("beforeunload", save);

function init() {
  setTheme(state.theme);
  setupPWA();
  rollover();
  renderAll();
  setView("today", { force: true });
  animateHonor();
  setInterval(tick, 1000);
  setTimeout(tick, 350);
  setTimeout(finishBoot, 1500);
  if (state.firstRun) {
    state.firstRun = false;
    save();
  }
}
window.addEventListener("error", event => {
  finishBoot();
  console.error(event.error || event.message);
});
try { init(); } catch (e) {
  finishBoot();
  console.error(e);
  toast("не получилось запустить. обнови страницу");
}

</script>
</body>
</html>
